<header><h1>江山千秋万代 · 族谱辅助</h1><div class="sub">第十九版 · 多家族 · 分层家族树＋关系中心 · 爵位继承 · 皇帝继位改元</div><div class="era" id="eraLabel">—</div><div class="eraSub" id="eraSub">—</div><div class="yearbar"><div class="toolbar" style="margin:0"><button class="nextyear" onclick="nextYear()">⏩ 下一年</button><button onclick="undoLast()">↩️ 撤销上一步</button></div><span class="muted" style="color:#cbd5e1">年龄与生死状态自动更新</span></div></header>

<script>
const DB_NAME='jiangshan-family',DB_VER=19,STORE='state';let dbState=null,tab='总览',activeFamilyId=null,undoState=null,lastSavedState=null,lastAction='';
const tabs=['总览','人物名录','所有人物','家族树','关系','设置'];
const sample={version:19,currentYear:2052,activeFamilyId:'f1',eras:[{id:'e1',name:'永嘉',startYear:2052}],rulers:[],families:[{id:'f1',name:'示例家族'}],people:[
{id:'p1',name:'第一代·家主',gender:'男',birthYear:1980,deathYear:'',lifespan:78,title:'开国家主',parents:[],inherit:true,familyId:'f1'},
{id:'p2',name:'第一代·正室',gender:'女',birthYear:1982,deathYear:'',lifespan:82,title:'正室',parents:[],inherit:false,familyId:'f1'},
{id:'p3',name:'第二代·嫡长子',gender:'男',birthYear:2005,deathYear:'',lifespan:76,title:'继承人',parents:['p1','p2'],inherit:true,familyId:'f1'},
{id:'p4',name:'第二代·庶子',gender:'男',birthYear:2008,deathYear:'',lifespan:71,title:'庶子',parents:['p1'],inherit:false,familyId:'f1'},
{id:'p5',name:'第三代·嫡孙',gender:'男',birthYear:2028,deathYear:'',lifespan:80,title:'',parents:['p3'],inherit:false,familyId:'f1'},
{id:'p6',name:'第四代·嫡曾孙',gender:'女',birthYear:2052,deathYear:'',lifespan:79,title:'',parents:['p5'],inherit:false,familyId:'f1'}],spouses:[{id:'s1',partners:['p1','p2'],type:'正室'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readState(){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).get('main');q.onsuccess=()=>res(q.result?.data||null);q.onerror=()=>rej(q.error)})}
async function persist(skipHistory=false){const d=await openDB();return new Promise((res,rej)=>{if(!skipHistory&&lastSavedState&&JSON.stringify(lastSavedState)!==JSON.stringify(dbState))undoState=clone(lastSavedState);const q=d.transaction(STORE,'readwrite').objectStore(STORE).put({id:'main',data:dbState});q.onsuccess=()=>{lastSavedState=clone(dbState);res()};q.onerror=()=>rej(q.error)})}
function migrate(old){
 if(!old)return clone(sample);
 if(old.people&&Array.isArray(old.families)&&old.families.every(f=>!f.people)){
   old.version=19;old.people=old.people.map(p=>normalizePerson(p));old.spouses=Array.isArray(old.spouses)?old.spouses:[];old.eras=Array.isArray(old.eras)&&old.eras.length?old.eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}];old.rulers=Array.isArray(old.rulers)?old.rulers:[];old.titleTransfers=Array.isArray(old.titleTransfers)?old.titleTransfers:[];return old;
 }
 if(Array.isArray(old.families)){
   const people=[],spouses=[];
   old.families.forEach(f=>{(f.people||[]).forEach(p=>people.push({...normalizePerson(p),familyId:f.id}));(f.spouses||[]).forEach(s=>spouses.push({...s,familyId:f.id}))});
   return {version:19,currentYear:Number(old.currentYear)||2052,activeFamilyId:old.activeFamilyId||old.families[0]?.id||null,eras:Array.isArray(old.eras)&&old.eras.length?old.eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}],rulers:Array.isArray(old.rulers)?old.rulers:[],titleTransfers:Array.isArray(old.titleTransfers)?old.titleTransfers:[],families:old.families.map(f=>({id:f.id,name:f.name||'未命名家族'})),people,spouses};
 }
 if(old.people){const fid='f1';return {version:19,currentYear:Number(old.currentYear)||2052,activeFamilyId:fid,eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}],rulers:Array.isArray(old.rulers)?old.rulers:[],titleTransfers:Array.isArray(old.titleTransfers)?old.titleTransfers:[],families:[{id:fid,name:old.familyName||'默认家族'}],people:old.people.map(p=>({...normalizePerson(p),familyId:fid})),spouses:old.spouses||[]}}
 return clone(sample);
}
function normalizePerson(p){let by=p.birthYear??yearOf(p.birth);let life=Number(p.lifespan);if(!Number.isInteger(life)||life<1)life='';return {...p,birthYear:by??'',deathYear:p.deathYear??'',deathReason:p.deathReason??'',deathType:p.deathType??'',note:p.note??'',age16Notified:!!p.age16Notified,lifespan:life,parents:Array.isArray(p.parents)?p.parents:[],parentsLocked:p.parentsLocked!==false,inherit:!!p.inherit,familyId:p.familyId??null,birthOrder:Number(p.birthOrder)||0,title:p.title??''}}
async function init(){try{dbState=migrate(await readState());if(!Array.isArray(dbState.families)||!dbState.families.length)dbState=clone(sample);dbState.people=(dbState.people||[]).map(normalizePerson);dbState.people.forEach(p=>{if(p.parentsLocked===undefined)p.parentsLocked=true});if(!dbState.spouses)dbState.spouses=[];if(!Array.isArray(dbState.rulers))dbState.rulers=[];if(!Array.isArray(dbState.titleTransfers))dbState.titleTransfers=[];applyAutomaticDeaths();if(!dbState.activeFamilyId||!dbState.families.some(f=>f.id===dbState.activeFamilyId))dbState.activeFamilyId=dbState.families[0].id;activeFamilyId=dbState.activeFamilyId;await persist(true);lastSavedState=clone(dbState);render()}catch(e){alert('本机存储初始化失败：'+e)}}
function family(){return dbState.families.find(f=>f.id===activeFamilyId)||dbState.families[0]}
function people(all=false){return all?(dbState.people||[]):(dbState.people||[]).filter(p=>p.familyId===activeFamilyId)}
function person(id){return (dbState.people||[]).find(p=>p.id===id)}
function children(id){return (dbState.people||[]).filter(p=>p.parents?.includes(id))}
function spousesOf(id){return (dbState.spouses||[]).filter(s=>s.partners.includes(id)).map(s=>({rel:s,people:s.partners.filter(x=>x!==id).map(person).filter(Boolean)}))}
function familyNameById(id){return dbState.families.find(f=>f.id===id)?.name||'无归属家族'}
function yearOf(v){if(v===null||v===undefined||v==='')return null;let n=Number(v);return Number.isInteger(n)?n:null}
function isBorn(p){let b=yearOf(p.birthYear);return b===null||b<=dbState.currentYear}
function deathYear(p){let manual=yearOf(p.deathYear);if(manual!==null)return manual;let b=yearOf(p.birthYear),l=Number(p.lifespan);return Number.isInteger(b)&&Number.isInteger(l)?b+l:null}
function isDead(p){let d=deathYear(p);return d!==null&&dbState.currentYear>=d}
function age(b,d){let by=yearOf(b);if(by===null)return '—';let ey=d!==undefined&&d!==null&&d!==''?yearOf(d):dbState.currentYear;if(ey===null)return '—';if(ey<by)return '未出生';return Math.max(1,ey-by+1)+'岁'}
function displayAge(p){if(!isBorn(p))return '未出生';if(isDead(p)){let d=deathYear(p),b=yearOf(p.birthYear);return Number.isInteger(d)&&Number.isInteger(b)?Math.max(1,d-b+1)+'岁':'—'}return age(p.birthYear)}
function statusText(p){if(!isBorn(p))return '未出生';if(isDead(p))return '已故';return '在世'}
function eraAt(y){let list=[...(dbState.eras||[])].filter(e=>Number.isInteger(Number(e.startYear))&&e.name).sort((a,b)=>a.startYear-b.startYear);let found=null;for(const e of list)if(y>=Number(e.startYear))found=e;return found||{name:'未命名年号',startYear:y}}
function eraDisplay(y){let e=eraAt(y),n=y-Number(e.startYear)+1;let nums=['','元','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一','三十二','三十三','三十四','三十五','三十六','三十七','三十八','三十九','四十','四十一','四十二','四十三','四十四','四十五','四十六','四十七','四十八','四十九','五十'];let ns=n<=50?nums[n]:String(n);return `${e.name}${ns}年`}
function currentRuler(y){let rs=[...(dbState.rulers||[])].filter(r=>Number.isInteger(Number(r.accessionYear))&&Number(r.accessionYear)<=y).sort((a,b)=>Number(a.accessionYear)-Number(b.accessionYear));let r=rs[rs.length-1];return r?person(r.personId):null}
function applyAutomaticDeaths(){(dbState.people||[]).forEach(p=>{if(!isBorn(p)||p.deathType==='意外')return;let b=yearOf(p.birthYear),l=Number(p.lifespan);if(!Number.isInteger(b)||!Number.isInteger(l)||l<1)return;let naturalDeathYear=b+l;if(dbState.currentYear>=naturalDeathYear){p.deathYear=naturalDeathYear;p.deathType='寿命终止';p.deathReason='达到登记寿命';}else if(p.deathType==='寿命终止'){p.deathYear='';p.deathType='';p.deathReason='';}})}
function checkAge16(prevYear,newYear){let reached=[];(dbState.people||[]).forEach(p=>{let b=yearOf(p.birthYear);if(!Number.isInteger(b)||p.age16Notified||!isBorn(p)||isDead(p))return;let y16=b+15;if(y16>prevYear&&y16<=newYear){p.age16Notified=true;reached.push(p.name)}});return reached}
async function advanceToYear(newYear,prevYear){dbState.currentYear=newYear;applyAutomaticDeaths();let reached=checkAge16(prevYear,newYear);await persist();render();if(reached.length)alert(`🎉 成长提醒\n\n${reached.join('、')} 已成长到16岁。\n\n可以考虑为其登记成年礼、婚配、爵位或新的身份。`)}
function nextYear(){let prev=Number(dbState.currentYear||1);advanceToYear(prev+1,prev)}
function generation(p,seen=new Set()){if(!p||!p.parents?.length)return 1;if(seen.has(p.id))return 1;seen.add(p.id);let vals=p.parents.map(x=>generation(person(x),new Set(seen))).filter(Number.isFinite);return vals.length?1+Math.max(...vals):1}
function generationLabel(p){if(!p)return '第1代';if(!(p.parents||[]).length){let ss=spousesOf(p.id).flatMap(s=>s.people);if(ss.some(o=>o&&o.familyId!==p.familyId))return '配偶';}return `第${p.generation||1}代`}
function recalc(){(dbState.people||[]).forEach(p=>p.generation=generation(p))}
function childRank(p){
 let parentIds=p.parents||[];
 let fatherId=parentIds.map(person).find(x=>x?.gender==='男')?.id;
 let motherId=parentIds.map(person).find(x=>x?.gender==='女')?.id;
 let anchor=fatherId||motherId;
 if(!anchor)return null;
 let ps=(dbState.people||[]).filter(x=>x.id===p.id||((x.parents||[]).includes(anchor)&&x.gender===p.gender));
 ps.sort((a,b)=>{let ay=yearOf(a.birthYear),by=yearOf(b.birthYear);if(ay!==by)return (ay??999999)-(by??999999);return (Number(a.birthOrder)||0)-(Number(b.birthOrder)||0)||String(a.id).localeCompare(String(b.id));});
 let idx=ps.findIndex(x=>x.id===p.id)+1;
 return idx>0?idx:null;
}
function chineseNum(n){if(!Number.isInteger(n)||n<1)return '';const d=['零','一','二','三','四','五','六','七','八','九'];if(n<10)return d[n];if(n<20)return '十'+(n%10?d[n%10]:'');if(n<100)return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');if(n<1000)return d[Math.floor(n/100)]+'百'+(n%100<10&&n%100?'零':'')+(n%100?chineseNum(n%100):'');if(n<10000)return d[Math.floor(n/1000)]+'千'+(n%1000<100&&n%1000?'零':'')+(n%1000?chineseNum(n%1000):'');return String(n)}
function rankText(n,gender){if(!n)return '';return `${chineseNum(n)}${gender==='男'?'子':'女'}`}
function childRankLabel(p){let n=childRank(p);if(!n)return '';let leg=legitimacy(p);return `${leg==='嫡'?'嫡':leg==='庶'?'庶':''}${rankText(n,p.gender)}`}
function legitimacy(p){if(!p.parents?.length)return '—';let mother=p.parents.map(person).find(x=>x?.gender==='女'),father=p.parents.map(person).find(x=>x?.gender==='男');if(!mother||!father)return '庶';let ok=spousesOf(mother.id).some(x=>x.rel.type==='正室'&&x.people.some(y=>y.id===father.id));return ok?'嫡':'庶'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function personCard(p){let rank=childRankLabel(p),dead=isDead(p),genderClass=p.gender==='男'?'male':'female';return `<div class="person-card ${dead?'is-dead':''}"><div class="person-main"><div class="person-top"><b class="person-name ${genderClass} name-edit" onclick="editPerson('${p.id}')" role="button" tabindex="0">${esc(p.name)}</b>${statusBadge(p)}</div><div class="person-meta">第${p.generation||1}代${rank?' · '+esc(rank):''} · ${dead?'享年'+displayAge(p):displayAge(p)} · ${esc(familyNameById(p.familyId)||'无归属家族')}</div></div><button class="more-btn" aria-label="更多操作" onclick="personMenu('${p.id}')">···</button></div>`}

function deriveRole(p){if(p.gender==='女')return 'female';return p.familyId===activeFamilyId?'male':'inlaw'}
function roleIcon(role){return {head:'👑',female:'🌸',male:'🌳',inlaw:'☀️'}[role]||''}
function nodeActions(p,opts){let btns=[];btns.push(`<button onclick="event.stopPropagation();editPerson('${p.id}')">编辑</button>`);if(opts.mode==='spouse'){btns.push(`<button onclick="event.stopPropagation();addChild('${p.id}')">生子</button>`);if(opts.relId)btns.push(`<button class="danger" onclick="event.stopPropagation();removeSpouse('${opts.relId}','${p.id}')">解除</button>`)}else{btns.push(`<button onclick="event.stopPropagation();addSpouse('${p.id}')">婚配</button>`)}if(p.familyId&&p.familyId!==activeFamilyId)btns.push(`<button onclick="event.stopPropagation();switchFamily('${p.familyId}')">跳转</button>`);btns.push(`<button class="danger" onclick="event.stopPropagation();deletePerson('${p.id}')">删除</button>`);return btns.join('')}
function nodeBox(p,opts={}){opts=Object.assign({isHead:false,mode:'blood',relId:null},opts);let role=opts.isHead?'head':deriveRole(p);return `<div class="nodebox role-${role} ${isDead(p)?'dead':''}"><div class="name">${opts.isHead?roleIcon(role)+' ':''}${esc(p.name)}</div><div class="meta">第${p.generation||1}代${childRankLabel(p)?' · '+esc(childRankLabel(p)):''} · ${isDead(p)?'享年'+displayAge(p):displayAge(p)}</div>${p.inherit?'<span class="tag inherit">继承人</span>':''}${isDead(p)?'<span class="tag dead">已故</span>':''}<div class="node-actions">${nodeActions(p,opts)}</div></div>`}

function filterAllPeople(){let q=(document.getElementById('allPeopleSearch')?.value||'').trim().toLowerCase(),g=document.getElementById('allGender')?.value||'全部',st=document.getElementById('allStatus')?.value||'全部';let ps=people(true).filter(p=>{let okq=!q||p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)||(familyNameById(p.familyId)||'').toLowerCase().includes(q);let okg=g==='全部'||p.gender===g;let agev=allPersonSortValue(p),okst=st==='全部'||(st==='已故'&&statusText(p)==='已故')||(st==='未出生'&&statusText(p)==='未出生')||(st==='成年'&&statusText(p)==='在世'&&agev>=16)||(st==='未成年'&&statusText(p)==='在世'&&agev<16);return okq&&okg&&okst}).sort((a,b)=>allPersonSortValue(b)-allPersonSortValue(a)||String(a.name).localeCompare(String(b.name),'zh-CN'));document.getElementById('allPeopleList').innerHTML=ps.map(allPersonCard).join('')||'<div class="empty">没有找到匹配人物。</div>'}

let relationFocusId=null;
let treeResizeObserver=null,treeDrawFrame=0;
function tree(){let ps=people(),ids=new Set(ps.map(p=>p.id)),candidates=ps.filter(p=>!(p.parents||[]).some(id=>ids.has(id))),includedAsSpouse=new Set();candidates.forEach(p=>spousesOf(p.id).forEach(s=>s.people.forEach(o=>{if(candidates.some(c=>c.id===o.id)&&String(p.id)>String(o.id))includedAsSpouse.add(p.id)})));let roots=candidates.filter(p=>!includedAsSpouse.has(p.id));if(treeResizeObserver)treeResizeObserver.disconnect();app.innerHTML=familySelector()+`<div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 家族树</div><div class="family-tree-note">本人居中，正妻、妾室独立排列在下一层；子女只连接至对应配偶。连线会随屏幕尺寸与横向滚动区域自动计算。</div><div class="toolbar"><button onclick="setTab('人物名录')">人物名录</button><button onclick="addPerson()" class="primary">＋ 添加人物</button></div><div class="tree-wrap"><div class="tree-canvas"><div id="treeStage" class="tree-svg-stage"><svg id="treeLines" class="tree-svg-lines" aria-hidden="true"></svg><div class="tree-forest">${roots.map(p=>treeBranch(p,new Set(),true)).join('')||'<div class="empty">暂无人物，请先添加人物。</div>'}</div></div></div></div></div>`;scheduleTreeLines();let stage=document.getElementById('treeStage');if(stage&&window.ResizeObserver){treeResizeObserver=new ResizeObserver(scheduleTreeLines);treeResizeObserver.observe(stage)}}
function relation(){let ps=people();if(!relationFocusId||!ps.some(p=>p.id===relationFocusId))relationFocusId=ps[0]?.id||null;app.innerHTML=familySelector()+`<div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 关系中心</div><div class="family-tree-note">以人物为中心查看父母、配偶和子女。点击任何人物即可切换中心，不再要求你在一张巨大族谱图里找人。</div><div class="searchbox"><input id="relationSearch" placeholder="搜索姓名……" oninput="renderRelationResults()"><button onclick="document.getElementById('relationSearch').value='';renderRelationResults()">清除</button></div><div id="relationResults"></div><div id="relationView"></div></div>`;renderRelationResults();renderRelationView()}
function renderRelationResults(){let box=document.getElementById('relationResults');if(!box)return;let q=(document.getElementById('relationSearch')?.value||'').trim().toLowerCase();let hits=people(true).filter(p=>!q||p.name.toLowerCase().includes(q)||(familyNameById(p.familyId)||'').toLowerCase().includes(q)).slice(0,12);box.innerHTML=q?hits.map(p=>`<button class="relation-result" onclick="relationFocusId='${p.id}';renderRelationResults();renderRelationView()"><span class="${p.gender==='男'?'male':'female'}">${esc(p.name)}</span> · ${esc(familyNameById(p.familyId))}</button>`).join(''):''}
function relationPersonLink(p,label){return p?`<button class="relation-link ${p.gender==='男'?'male':''}" onclick="relationFocusId='${p.id}';renderRelationView()">${label?esc(label)+': ':''}<span class="${p.gender==='男'?'male':'female'}">${esc(p.name)}</span> · ${isDead(p)?'享年'+displayAge(p):displayAge(p)}</button>`:''}
function renderRelationView(){let box=document.getElementById('relationView');if(!box)return;let p=person(relationFocusId);if(!p){box.innerHTML='<div class="empty">暂无人物</div>';return}let pars=(p.parents||[]).map(person).filter(Boolean), father=pars.find(x=>x.gender==='男'),mother=pars.find(x=>x.gender==='女'),ss=spousesOf(p.id).flatMap(s=>s.people.map(o=>({person:o,type:s.rel.type}))),kids=children(p.id);box.innerHTML=`<div class="relation-focus ${isDead(p)?'is-dead':''}"><div class="person-top"><b class="focus-name ${p.gender==='男'?'male':'female'}">${esc(p.name)}</b>${statusBadge(p)}</div><div class="person-meta">第${p.generation||1}代 · ${childRankLabel(p)?esc(childRankLabel(p))+' · ':''}${isDead(p)?'享年'+displayAge(p):displayAge(p)}${p.title?' · '+esc(p.title):''}</div></div><div class="relation-section"><div class="section-title">父母</div>${relationPersonLink(father,'父亲')||'<div class="muted">未登记</div>'}${relationPersonLink(mother,'母亲')||'<div class="muted">未登记</div>'}</div><div class="relation-section"><div class="section-title">配偶</div>${ss.map(x=>relationPersonLink(x.person,x.type)).join('')||'<div class="muted">未登记</div>'}</div><div class="relation-section"><div class="section-title">子女 · ${kids.length}人</div>${kids.map(k=>relationPersonLink(k,childRankLabel(k)||'子女')).join('')||'<div class="muted">未登记</div>'}</div><div class="toolbar"><button class="primary" onclick="editPerson('${p.id}')">查看/编辑人物</button>${p.gender==='女'?`<button onclick="addChild('${p.id}')">＋ 新增子女</button>`:''}</div>`}
function treeNode(p,opts={}){return `<div class="tree-node" data-tree-id="${esc(p.id)}">${nodeBox(p,opts)}</div>`}
function treeLink(from,targets,content,kind=''){return `<div class="${kind}" data-tree-from="${esc(from)}" data-tree-targets="${targets.map(x=>esc(x)).join(',')}">${content}</div>`}
function spouseTreeLabel(type){return type==='正室'?'正妻':(type||'配偶')}
function treeBranch(p,seen,isHead=false){if(seen.has(p.id))return '';let ns=new Set(seen);ns.add(p.id);let rels=spousesOf(p.id),spouses=rels.flatMap(x=>x.people.map(o=>({person:o,rel:x.rel}))).filter(x=>!seen.has(x.person.id));spouses.sort((a,b)=>{let order=t=>t==='正室'?0:t==='妾室'?1:2;return order(a.rel.type)-order(b.rel.type)});let allKids=children(p.id).filter(x=>x.id!==p.id);let grouped=[],used=new Set();spouses.forEach(x=>{let pairKids=allKids.filter(k=>(k.parents||[]).includes(x.person.id)&&!used.has(k.id));pairKids.sort((a,b)=>(a.generation||1)-(b.generation||1)||Number(a.birthOrder)-Number(b.birthOrder));pairKids.forEach(k=>used.add(k.id));grouped.push({spouse:x.person,rel:x.rel,kids:pairKids})});let unmatched=allKids.filter(k=>!used.has(k.id));let spouseContent=grouped.map(g=>{let kids=g.kids.length?treeLink(g.spouse.id,g.kids.map(k=>k.id),`<div class="tree-children-row">${g.kids.map(k=>`<div class="tree-child-branch">${treeBranch(k,new Set([...ns,g.spouse.id]))}</div>`).join('')}</div>`,'tree-children-link'):'';return `<div class="tree-spouse-group"><div class="tree-relation-label">[${esc(spouseTreeLabel(g.rel.type))}]</div>${treeNode(g.spouse,{mode:'spouse',relId:g.rel.id})}${kids}</div>`}).join('');let spouseLayer=spouses.length?treeLink(p.id,grouped.map(g=>g.spouse.id),spouseContent,'tree-spouse-row'):'';let unmatchedLayer=unmatched.length?treeLink(p.id,unmatched.map(k=>k.id),`<div class="tree-unpaired-row"><div class="tree-relation-label">[未登记另一方父母]</div><div class="tree-children-row">${unmatched.map(k=>`<div class="tree-child-branch">${treeBranch(k,ns)}</div>`).join('')}</div></div>`,'tree-unpaired-link'):'';return `<section class="tree-person-branch">${treeNode(p,{isHead:isHead,mode:'blood'})}${spouseLayer}${unmatchedLayer}</section>`}
function scheduleTreeLines(){if(treeDrawFrame)cancelAnimationFrame(treeDrawFrame);treeDrawFrame=requestAnimationFrame(drawTreeLines)}
function drawTreeLines(){treeDrawFrame=0;let stage=document.getElementById('treeStage'),svg=document.getElementById('treeLines');if(!stage||!svg)return;let stageRect=stage.getBoundingClientRect(),width=Math.ceil(stage.scrollWidth),height=Math.ceil(stage.scrollHeight);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);let nodeById=new Map();stage.querySelectorAll('[data-tree-id]').forEach(el=>{if(!nodeById.has(el.dataset.treeId))nodeById.set(el.dataset.treeId,el)});let paths=[];stage.querySelectorAll('[data-tree-from][data-tree-targets]').forEach(group=>{let source=nodeById.get(group.dataset.treeFrom),targets=group.dataset.treeTargets.split(',').map(id=>nodeById.get(id)).filter(Boolean);if(!source||!targets.length)return;let sr=source.getBoundingClientRect(),sourceX=sr.left-stageRect.left+sr.width/2,sourceY=sr.bottom-stageRect.top;let points=targets.map(target=>{let r=target.getBoundingClientRect();return {x:r.left-stageRect.left+r.width/2,y:r.top-stageRect.top}});let railY=Math.max(sourceY+14,Math.min(...points.map(p=>p.y))-14);paths.push(`M ${sourceX} ${sourceY} V ${railY}`);if(points.length>1)paths.push(`M ${Math.min(...points.map(p=>p.x))} ${railY} H ${Math.max(...points.map(p=>p.x))} ${railY}`);points.forEach(point=>paths.push(`M ${point.x} ${railY} V ${point.y}`))});svg.innerHTML=paths.map(d=>`<path d="${d}"/>`).join('')}
window.addEventListener('resize',scheduleTreeLines)

function deleteFamily(id){if(dbState.families.length<=1)return alert('至少保留一个家族。');let f=dbState.families.find(x=>x.id===id);let ids=new Set(people(true).filter(p=>p.familyId===id).map(p=>p.id));let linkedChildren=dbState.people.filter(p=>p.familyId!==id&&(p.parents||[]).some(x=>ids.has(x))).length;if(!confirm(`删除“${f.name}”及其${ids.size}名人物？\n${linkedChildren?'已有其他家族人物与该家族存在亲子关系，这些关系会被保留为未完整登记。\n':''}此操作不可撤销。`))return;dbState.people=dbState.people.filter(p=>!ids.has(p.id));dbState.people.forEach(p=>p.parents=(p.parents||[]).filter(x=>!ids.has(x)));dbState.spouses=dbState.spouses.filter(s=>!s.partners.some(x=>ids.has(x)));dbState.families=dbState.families.filter(x=>x.id!==id);activeFamilyId=dbState.families[0].id;dbState.activeFamilyId=activeFamilyId;persist().then(render)}

function filterParentSelect(selectId,inputId){let sel=document.getElementById(selectId),inp=document.getElementById(inputId);if(!sel||!inp)return;let q=(inp.value||'').trim().toLowerCase();[...sel.options].forEach((o,i)=>{if(i===0){o.hidden=false;return}o.hidden=!!q&&!o.textContent.toLowerCase().includes(q)});}

function childParentsFor(id){
 let me=person(id), ss=spousesOf(id).flatMap(s=>s.people.filter(o=>o.id!==id).map(o=>({person:o,type:s.rel.type})));
 if(me?.gender==='女') return {mother:me,fathers:ss.filter(x=>x.person.gender==='男')};
 return {father:me,mothers:ss.filter(x=>x.person.gender==='女')};
}
function addChild(id){
 let me=person(id); if(!me)return;
 let info=childParentsFor(id), father=info.father, mother=info.mother, fathers=info.fathers||[], mothers=info.mothers||[];
 if(me.gender==='女' && fathers.length===0)return alert('这位母亲暂未登记男性配偶。请先添加配偶后再新增子女。');
 if(me.gender==='男' && mothers.length===0)return alert('这位父亲暂未登记女性配偶。请先添加配偶后再新增子女。');
 let fatherId=father?.id||fathers[0]?.person.id||'', motherId=mother?.id||mothers[0]?.person.id||'';
 if(fathers.length>1) return chooseChildParent(id,'father',fathers.map(x=>x.person));
 if(mothers.length>1) return chooseChildParent(id,'mother',mothers.map(x=>x.person));
 showChildForm(id,fatherId,motherId);
}

}
async function savePersonForm(id){lastAction=person(id)?'修改人物：'+person(id).name:'新增人物';let p=person(id),isNew=!p;if(!p){p={id,name:'',gender:'男',birthYear:'',deathYear:'',deathReason:'',deathType:'',lifespan:'',title:'',parents:[],inherit:false,familyId:activeFamilyId,birthOrder:Date.now(),note:'',age16Notified:false,parentsLocked:true};dbState.people.push(p)}p.name=document.getElementById('f_name').value.trim()||'未命名人物';let dup=(dbState.people||[]).some(q=>q.id!==p.id&&q.name.trim()===p.name.trim());if(isNew&&dup&&!confirm(`已存在同名人物“${p.name}”。\n\n仍然创建吗？`))return;p.gender=document.getElementById('f_gender').value;p.birthYear=yearOf(document.getElementById('f_birth').value)||dbState.currentYear;let enteredLife=Number(document.getElementById('f_lifespan').value);if(!Number.isInteger(enteredLife)||enteredLife<1||enteredLife>150)return alert('请填写有效的寿命（1～150岁）。');p.lifespan=enteredLife;p.deathYear=p.deathYear??'';p.deathReason=p.deathReason??'';p.deathType=p.deathType??'';p.title=document.getElementById('f_title').value.trim();p.note=document.getElementById('f_note').value.trim();p.familyId=activeFamilyId;p.inherit=document.getElementById('f_inherit').checked;if(isNew){p.parents=[document.getElementById('f_parent1').value,document.getElementById('f_parent2').value].filter(Boolean);if(p.parents.length===2&&p.parents[0]===p.parents[1])p.parents=p.parents.slice(0,1);p.parentsLocked=true;}if(!p.birthOrder)p.birthOrder=Date.now();await persist();closeModal();render()}
async function editParents(id){let p=person(id);if(!p)return;let fathers=people(true).filter(q=>q.id!==id&&q.gender==='男'),mothers=people(true).filter(q=>q.id!==id&&q.gender==='女');let cf=p.parents?.map(person).find(q=>q?.gender==='男')?.id||'',cm=p.parents?.map(person).find(q=>q?.gender==='女')?.id||'';if(!confirm(`确定要修改“${p.name}”的父母关系吗？\n\n这是族谱核心关系，修改后会影响世代、嫡庶和子女关系。`))return;modalRoot.innerHTML=`<div class="modal"><div class="sheet compact-sheet"><button class="close" onclick="editPerson('${id}')">✕</button><h2>修改父母关系</h2><div class="notice">可选择任意家族人物。修改后系统会重新计算世代与排行。</div><div class="row"><label>父亲<select id="edit_father"><option value="">— 未登记 —</option>${fathers.map(o=>`<option value="${o.id}" ${o.id===cf?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label><label>母亲<select id="edit_mother"><option value="">— 未登记 —</option>${mothers.map(o=>`<option value="${o.id}" ${o.id===cm?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label></div><div class="form-actions"><button class="primary" onclick="saveParents('${id}')">保存父母关系</button><button onclick="editPerson('${id}')">取消</button></div></div></div>`}
async function saveParents(id){lastAction='修改父母关系：'+(person(id)?.name||'人物');let p=person(id);if(!p)return;let f=document.getElementById('edit_father')?.value||'',m=document.getElementById('edit_mother')?.value||'';if(f&&m&&f===m)return alert('父亲和母亲不能是同一个人物。');p.parents=[f,m].filter(Boolean);await persist();closeModal();render();alert('父母关系已更新。')}
async function editNote(id){lastAction='修改备注：'+(person(id)?.name||'人物');let p=person(id);if(!p)return;let note=prompt(`编辑“${p.name}”的备注\n\n可记录性格、经历、功绩、婚姻、事件等。`,p.note||'');if(note===null)return;p.note=note.trim();await persist();render()}
async function deletePerson(id){lastAction='删除人物：'+(person(id)?.name||'人物');let p=person(id);if(!p)return;let spouseCount=(dbState.spouses||[]).filter(s=>s.partners.includes(id)).length,kidCount=children(id).length,relationCount=spouseCount+kidCount+(p.parents||[]).length+(dbState.titleTransfers||[]).filter(t=>t.fromId===id||t.toId===id).length;if(!confirm(`确定删除“${p.name}”？\n\n该人物拥有：\n${spouseCount}位配偶\n${kidCount}名子女\n${relationCount}条关系\n\n删除后关系将解除，此操作不可撤销。`))return;dbState.people=dbState.people.filter(x=>x.id!==id);dbState.people.forEach(x=>x.parents=(x.parents||[]).filter(v=>v!==id));dbState.spouses=dbState.spouses.filter(s=>!s.partners.includes(id));await persist();closeModal();render()}
function addSpouse(id){let families=[...dbState.families];modalRoot.innerHTML+=`<div class="modal" style="z-index:40"><div class="sheet"><button class="close" onclick="this.parentElement.parentElement.remove()">✕</button><h2>添加配偶</h2><div class="notice">先选择配偶所属家族；选择“无归属家族”时，可直接输入姓名并在这里生成新人物。</div><label>配偶所属家族<select id="new_spouse_family" onchange="refreshSpouseChooser('${id}')"><option value="">无归属家族</option>${families.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><div id="spouseChooser"></div><label>婚姻身份<select id="new_spouse_type"><option>正室</option><option>妾室</option><option>其他</option></select></label><div class="form-actions"><button class="primary" onclick="saveSpouse('${id}')">保存</button><button onclick="this.parentElement.parentElement.parentElement.remove()">取消</button></div></div></div>`;refreshSpouseChooser(id)}
function refreshSpouseChooser(id){let fid=document.getElementById('new_spouse_family').value,box=document.getElementById('spouseChooser');if(!fid){box.innerHTML=`<label>新配偶姓名<input id="new_spouse_name" placeholder="例如 王氏"></label><div class="row"><label>性别<select id="new_spouse_gender"><option>女</option><option>男</option></select></label><label>出生年份<input id="new_spouse_birth" type="number" value="${dbState.currentYear}" placeholder="例如 2052"></label></div><label>寿命（岁）<input id="new_spouse_lifespan" type="number" min="1" max="150" value="" placeholder="请输入游戏中的寿命"></label>`;return}let opts=people(true).filter(p=>p.familyId===fid&&p.id!==id);box.innerHTML=`<label>搜索配偶<input id="new_spouse_search" placeholder="输入姓名快速筛选" oninput="filterParentSelect('new_spouse_person','new_spouse_search')"></label><label>选择具体人物<select id="new_spouse_person">${opts.map(o=>`<option value="${o.id}">${esc(o.name)} · ${o.gender} · ${statusText(o)}</option>`).join('')||'<option value="">该家族暂无人物</option>'}</select></label>`}
async function saveSpouse(id){let fid=document.getElementById('new_spouse_family').value,type=document.getElementById('new_spouse_type').value,oid='';if(fid){oid=document.getElementById('new_spouse_person')?.value||'';if(!oid)return alert('该家族暂无可选择的人物。')}else{let name=document.getElementById('new_spouse_name').value.trim();let life=Number(document.getElementById('new_spouse_lifespan').value);if(!name)return alert('请输入新配偶姓名。');if(!Number.isInteger(life)||life<1||life>150)return alert('请填写有效的寿命（1～150岁）。');let p={id:'p'+Date.now(),name,gender:document.getElementById('new_spouse_gender').value,birthYear:yearOf(document.getElementById('new_spouse_birth').value)||dbState.currentYear,deathYear:'',deathReason:'',deathType:'',note:'',age16Notified:false,lifespan:Number(document.getElementById('new_spouse_lifespan').value),title:'',parents:[],parentsLocked:true,inherit:false,familyId:null};dbState.people.push(p);oid=p.id}let existing=dbState.spouses.find(s=>s.partners.includes(id)&&s.partners.includes(oid));if(existing)existing.type=type;else dbState.spouses.push({id:'s'+Date.now(),partners:[id,oid],type});await persist();editPerson(id)}
async function removeSpouse(sid,id){dbState.spouses=dbState.spouses.filter(s=>s.id!==sid);await persist();editPerson(id)}
async function death(id){lastAction='记录意外死亡：'+(person(id)?.name||'人物');let p=person(id);if(!p||isDead(p))return alert('该人物已经是已故状态。');if(!isBorn(p))return alert('该人物尚未出生，不能登记死亡。');let y=prompt(`记录“${p.name}”的意外死亡年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(y===null)return;let year=yearOf(y);let birth=yearOf(p.birthYear);if(year===null||birth===null||year<birth||year>dbState.currentYear)return alert(`请输入 ${birth}～${dbState.currentYear} 之间的有效年份。`);let reason=prompt('死亡原因（可选，例如：意外、战乱、疾病等）','意外');if(reason===null)reason='意外';p.deathYear=year;p.deathType='意外';p.deathReason=reason.trim();await persist();closeModal();render();alert(`${p.name}已记录为${year}年意外死亡。`)}
function searchPeople(){let q=prompt('搜索姓名');if(q===null)return;let hits=people(true).filter(p=>p.name.includes(q));alert(hits.length?hits.map(p=>`${p.name}（${familyNameById(p.familyId)}，第${p.generation}代，${statusText(p)}）`).join('\n'):'没有找到')}
async function inheritTitle(sourceId){lastAction='爵位继承';
 let source=person(sourceId);if(!source||!isDead(source)||!source.title||source.title==='皇帝')return alert('该人物没有可继承的爵位。');
 let candidates=people(true).filter(p=>p.id!==sourceId&&isBorn(p)&&!isDead(p));
 candidates.sort((a,b)=>{let af=a.familyId===source.familyId?0:1,bf=b.familyId===source.familyId?0:1;if(af!==bf)return af-bf;let aa=displayAge(a)==='未出生'?-1:yearOf(a.birthYear);let bb=displayAge(b)==='未出生'?-1:yearOf(b.birthYear);return (bb??-999999)-(aa??-999999)||String(a.name).localeCompare(String(b.name));});
 if(!candidates.length)return alert('当前没有可继承爵位的在世人物。');
 let opts=candidates.map((p,i)=>`${i+1}. ${p.name} · ${p.gender} · ${statusText(p)} · ${familyNameById(p.familyId)}${p.inherit?' · 继承人':''}`).join('\n');
 let input=prompt(`“${source.name}”的爵位为“${source.title}”。\n\n请选择爵位继承人（输入编号）：\n\n${opts}`, '1');
 if(input===null)return;let idx=Number(input)-1;if(!Number.isInteger(idx)||idx<0||idx>=candidates.length)return alert('请输入有效的继承人编号。');
 let heir=candidates[idx];if(heir.title&&heir.title!==source.title){if(!confirm(`“${heir.name}”目前已有“${heir.title}”。\n\n确定用“${source.title}”替换其当前爵位/封号吗？`))return;}let year=prompt(`“${heir.name}”继承“${source.title}”的年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(year===null)return;year=yearOf(year);if(year===null||year<1||year>dbState.currentYear)return alert(`请输入 1～${dbState.currentYear} 之间的有效年份。`);
 if(!confirm(`确定让“${heir.name}”在${year}年继承“${source.title}”吗？\n\n原持有人：${source.name}\n新持有人：${heir.name}`))return;
 let oldTitle=heir.title||'';heir.title=source.title;
 dbState.titleTransfers=dbState.titleTransfers||[];dbState.titleTransfers.push({id:'tt'+Date.now(),title:source.title,fromId:source.id,toId:heir.id,year,sourceDeathYear:deathYear(source)});
 await persist();closeModal();render();alert(`${heir.name}已于${year}年继承“${source.title}”。`);
}
async function accession(id){lastAction='皇帝继位：'+(person(id)?.name||'人物');
 let p=person(id);if(!p)return;
 let y=prompt(`登记“${p.name}”继位年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(y===null)return;
 let year=yearOf(y);if(year===null||year<1)return alert('请输入有效的继位年份。');
 let eraName=prompt(`为“${p.name}”设置新年号。\n例如：康熙`, '新年号');if(eraName===null)return;eraName=eraName.trim();if(!eraName)return alert('请输入新年号。');
 if(dbState.rulers?.some(r=>Number(r.accessionYear)===year)){if(!confirm('这个游戏年份已经登记过皇帝继位，仍要新增吗？'))return;}
 let same=(dbState.eras||[]).find(e=>Number(e.startYear)===year);if(same)same.name=eraName;else{same={id:'e'+Date.now(),name:eraName,startYear:year};dbState.eras.push(same)}
 dbState.rulers=(dbState.rulers||[]).filter(r=>Number(r.accessionYear)!==year);dbState.rulers.push({id:'r'+Date.now(),personId:id,accessionYear:year,eraId:same.id});
 if(!p.title)p.title='皇帝';
 await persist();closeModal();render();alert(`${p.name}已登记为${year}年继位，${eraDisplay(year)}起用“${eraName}”年号。`);
}
function addEra(){let name=document.getElementById('eraName').value.trim(),start=Number(document.getElementById('eraStart').value);if(!name||!Number.isInteger(start)||start<1)return alert('请填写有效的年号和起始游戏年份。');let same=dbState.eras.find(e=>e.startYear===start);if(same)same.name=name;else dbState.eras.push({id:'e'+Date.now(),name,startYear:start});persist().then(render)}
async function deleteTitleTransfer(id){let t=(dbState.titleTransfers||[]).find(x=>x.id===id);if(!t)return;if(!confirm('删除这条爵位继承记录？不会自动恢复人物原爵位。'))return;dbState.titleTransfers=dbState.titleTransfers.filter(x=>x.id!==id);await persist();render()}
async function deleteRuler(id){let r=(dbState.rulers||[]).find(x=>x.id===id);if(!r)return;if(!confirm('删除这条皇帝继位记录？年号不会自动删除。'))return;dbState.rulers=dbState.rulers.filter(x=>x.id!==id);await persist();render()}
function deleteEra(id){if((dbState.eras||[]).length<=1)return alert('至少保留一个年号。');if(!confirm('删除这个年号？'))return;dbState.eras=dbState.eras.filter(e=>e.id!==id);persist().then(render)}
async function saveYearSetting(){let y=Number(document.getElementById('yearSetting').value);if(!Number.isInteger(y)||y<1)return alert('请输入有效游戏年份。');let prev=Number(dbState.currentYear||1);await advanceToYear(y,prev)}
async function undoLast(){if(!undoState)return alert('目前没有可以撤销的操作。');if(!confirm(`撤销上一步操作？\n\n${lastAction||'数据变更'}`))return;dbState=clone(undoState);activeFamilyId=dbState.activeFamilyId||dbState.families?.[0]?.id||null;undoState=null;await persist(true);render();alert('已撤销上一步操作。')}
function exportData(){const blob=new Blob([JSON.stringify(dbState,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='江山千秋万代-族谱-第十七版-备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=migrate(JSON.parse(r.result));if(!x.families?.length)throw Error();dbState=x;activeFamilyId=x.activeFamilyId||x.families[0].id;await persist();render();alert('导入成功。')}catch(e){alert('导入失败：不是有效的族谱 JSON。')}};r.readAsText(f)};i.click()}
async function resetData(){if(!confirm('确定恢复示例数据？当前本地数据会被替换。'))return;dbState=clone(sample);activeFamilyId='f1';await persist();render()}
async function clearAllPeople(){
  const count=(dbState.people||[]).length;
  if(!count){alert('当前已经没有人物了。');return}
  const ok=confirm(`确定要清空全部 ${count} 名人物吗？\n\n这会同时删除所有配偶关系、父母子女关系以及人物统计。\n家族名称、年号和当前游戏年份会保留。\n\n此操作不可撤销。`);
  if(!ok)return;
  dbState.people=[];
  dbState.spouses=[];
  dbState.families=(dbState.families||[]).map(f=>({...f}));
  await persist();
  tab='总览';
  render();
  alert('已清空全部人物，当前族谱已恢复为 0 人。');
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
