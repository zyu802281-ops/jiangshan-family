<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>江山千秋万代 · 族谱辅助</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#f5f6f8;color:#172033}header{padding:20px 18px 14px;background:#111827;color:#fff}h1{font-size:22px;margin:0}.sub{opacity:.72;font-size:12px;margin-top:5px}nav{display:flex;gap:7px;padding:9px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd;overflow:auto}button{border:0;border-radius:11px;padding:10px 13px;background:#e8ebf0;color:#172033;font-weight:650;font-size:14px}button.active{background:#111827;color:#fff}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.small{padding:7px 9px;font-size:12px}main{padding:14px;max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 5px #00000010;margin-bottom:12px}.num{font-size:29px;font-weight:800}.muted{color:#687386;font-size:13px}.person{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #eee;padding:12px 0}.person:first-child{border-top:0}.badge{display:inline-block;font-size:11px;background:#eef0f4;padding:4px 7px;border-radius:8px;margin:2px}.badge.inherit{background:#fff3cd}.badge.concubine{background:#f3e8ff}.badge.dead{background:#e5e7eb}.tree{overflow:auto}.node{margin:7px 0;padding:12px;background:#fff;border-left:3px solid #111827;border-radius:10px;min-width:280px}.node.dead{opacity:.65}.indent{margin-left:20px}input,select,textarea{width:100%;padding:11px;border:1px solid #d7dce4;border-radius:10px;margin:5px 0 10px;font-size:15px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-weight:800;margin:8px 0 5px}.empty{text-align:center;padding:25px;color:#7a8495}.notice{padding:11px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;color:#475569;margin:8px 0}.relation{padding:10px;border-radius:10px;background:#f8fafc;margin:7px 0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right}.check{display:flex;align-items:center;gap:8px;margin:5px 0 12px}.check input{width:auto;margin:0}.footer{padding:20px 0;color:#7a8495;font-size:12px;text-align:center}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><h1>江山千秋万代 · 族谱辅助</h1><div class="sub">第二版 · 本地 IndexedDB · 可离线使用</div></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modalRoot"></div>
<script>
const DB_NAME='jiangshan-family',DB_VER=2,STORE='state';let dbState;let tab='总览';
const tabs=['总览','人物名录','家族树','死亡登记','设置'];
const sample={version:2,familyName:'江山千秋万代',people:[
{id:'p1',name:'第一代·家主',gender:'男',birth:'1980-01-01',death:'',title:'开国家主',parents:[],inherit:true},
{id:'p2',name:'第一代·正室',gender:'女',birth:'1982-01-01',death:'',title:'正室',parents:[],inherit:false},
{id:'p3',name:'第二代·嫡长子',gender:'男',birth:'2005-01-01',death:'',title:'继承人',parents:['p1','p2'],inherit:true},
{id:'p4',name:'第二代·庶子',gender:'男',birth:'2008-01-01',death:'',title:'庶子',parents:['p1'],inherit:false},
{id:'p5',name:'第三代·嫡孙',gender:'男',birth:'2028-01-01',death:'',title:'',parents:['p3'],inherit:false},
{id:'p6',name:'第四代·嫡曾孙',gender:'女',birth:'2052-01-01',death:'',title:'',parents:['p5'],inherit:false}],
spouses:[{id:'s1',partners:['p1','p2'],type:'正室'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function init(){try{const d=await openDB();dbState=await new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).get('main');q.onsuccess=()=>res(q.result?.data||null);q.onerror=()=>rej(q.error)});if(!dbState){dbState=clone(sample);await persist()}render()}catch(e){alert('本机存储初始化失败：'+e)}}
async function persist(){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).put({id:'main',data:dbState});q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function person(id){return dbState.people.find(p=>p.id===id)}
function children(id){return dbState.people.filter(p=>p.parents?.includes(id))}
function spousesOf(id){return dbState.spouses.filter(s=>s.partners.includes(id)).map(s=>({rel:s,people:s.partners.filter(x=>x!==id).map(person).filter(Boolean)}))}
function generation(p,seen=new Set()){if(!p)return 1;if(p.generation)return p.generation;if(!p.parents?.length)return 1;if(seen.has(p.id))return 1;seen.add(p.id);return 1+Math.max(...p.parents.map(x=>generation(person(x),new Set(seen))))}
function recalc(){dbState.people.forEach(p=>{p.generation=generation(p);if(!p.parents?.length)p.generation=1});}
function age(b,d){if(!b)return '—';let e=d?new Date(d):new Date(),x=new Date(b);let a=e.getFullYear()-x.getFullYear();if(e.getMonth()<x.getMonth()||(e.getMonth()==x.getMonth()&&e.getDate()<x.getDate()))a--;return Math.max(0,a)+'岁'}
function legitimacy(p){if(!p.parents?.length)return '—';let mother=p.parents.map(person).find(x=>x?.gender==='女');if(!mother)return '—';let rs=spousesOf(mother.id);let isPrimary=rs.some(x=>x.rel.type==='正室'&&x.people.some(y=>p.parents.includes(y.id)));return isPrimary?'嫡':'庶'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderNav(){nav.innerHTML=tabs.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}
function render(){recalc();renderNav();if(tab==='总览')overview();if(tab==='人物名录')directory();if(tab==='家族树')tree();if(tab==='死亡登记')deaths();if(tab==='设置')settings()}
function overview(){let ps=dbState.people;let roots=ps.filter(p=>!p.parents?.length);app.innerHTML=`<div class="grid"><div class="card"><div class="muted">总人数</div><div class="num">${ps.length}</div></div><div class="card"><div class="muted">男性</div><div class="num">${ps.filter(p=>p.gender==='男').length}</div></div><div class="card"><div class="muted">女性</div><div class="num">${ps.filter(p=>p.gender==='女').length}</div></div><div class="card"><div class="muted">已登记死亡</div><div class="num">${ps.filter(p=>p.death).length}</div></div></div><div class="card"><div class="section-title">当前谱系</div><div class="muted">已支持父母—子女、多人婚配、正室/妾室、嫡/庶判定、代数自动计算、继承人、爵位/封号、死亡登记、本地 IndexedDB、JSON 导入导出。</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button><button onclick="tab='家族树';render()">查看家族树</button></div></div><div class="card"><div class="section-title">第一代</div>${roots.map(p=>miniPerson(p)).join('')||'<div class="empty">还没有人物</div>'}</div>`}
function miniPerson(p){return `<div class="person"><div><b>${esc(p.name)}</b><span class="badge">${p.gender} · ${p.generation}代</span>${p.inherit?'<span class="badge inherit">继承人</span>':''}<div class="muted">${esc(p.title||'无封号')} · ${age(p.birth,p.death)}</div></div><button class="small" onclick="editPerson('${p.id}')">编辑</button></div>`}
function directory(){let ps=[...dbState.people].sort((a,b)=>a.generation-b.generation);app.innerHTML=`<div class="card"><div class="section-title">人物名录</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button><button onclick="searchPeople()">搜索</button></div>${ps.map(p=>personCard(p)).join('')||'<div class="empty">暂无人物</div>'}</div>`}
function personCard(p){let sp=spousesOf(p.id).flatMap(x=>x.people).map(x=>x.name).join('、')||'无';let par=p.parents?.map(x=>person(x)?.name).filter(Boolean).join('、')||'未登记';let ch=children(p.id).map(x=>x.name).join('、')||'无';return `<div class="person"><div style="flex:1"><b>${esc(p.name)}</b> <span class="badge">${p.gender} · 第${p.generation}代</span>${legitimacy(p)!=='—'?`<span class="badge ${legitimacy(p)==='庶'?'concubine':''}">${legitimacy(p)}</span>`:''}${p.inherit?'<span class="badge inherit">继承人</span>':''}${p.death?'<span class="badge dead">已故</span>':''}<div class="muted">${esc(p.title||'无封号')} · ${p.birth||'未录出生'} · ${age(p.birth,p.death)}</div><div class="muted">父母：${esc(par)}<br>配偶：${esc(sp)}<br>子女：${esc(ch)}</div></div><button class="small" onclick="editPerson('${p.id}')">编辑</button></div>`}
function tree(){let roots=dbState.people.filter(p=>!p.parents?.length);app.innerHTML=`<div class="card tree"><div class="section-title">家族树</div><div class="muted">关系由人物资料中的父母和配偶自动组成；代数随父母关系自动计算。</div><div style="margin-top:12px">${roots.map(p=>treeNode(p,0)).join('')||'<div class="empty">暂无根人物</div>'}</div></div>`}
function treeNode(p,level,seen=new Set()){if(seen.has(p.id))return '';let ns=new Set(seen);ns.add(p.id);let kids=children(p.id).sort((a,b)=>a.generation-b.generation);let sp=spousesOf(p.id).flatMap(x=>x.people);return `<div class="node ${p.death?'dead':''}" style="margin-left:${level*18}px"><b>${esc(p.name)}</b> <span class="badge">第${p.generation}代</span>${p.inherit?'<span class="badge inherit">继承人</span>':''}<div class="muted">${esc(p.title||'无封号')} · ${p.death?'享年'+age(p.birth,p.death):age(p.birth,'')}</div>${sp.length?`<div class="muted">配偶：${sp.map(x=>esc(x.name)).join('、')}</div>`:''}</div>${kids.map(k=>treeNode(k,level+1,ns)).join('')}`}
function deaths(){let ps=dbState.people;app.innerHTML=`<div class="card"><div class="section-title">死亡登记</div>${ps.map(p=>`<div class="person"><div><b>${esc(p.name)}</b><div class="muted">${p.death?'死亡：'+p.death+' · '+age(p.birth,p.death):'在世 / 未登记'}</div></div>${p.death?`<button class="small" onclick="death('${p.id}')">修改</button>`:`<button class="small" onclick="death('${p.id}')">登记</button>`}</div>`).join('')}</div>`}
function settings(){app.innerHTML=`<div class="card"><div class="section-title">数据管理</div><div class="notice">数据只保存在当前设备的浏览器 IndexedDB 中，不会自动上传到服务器。</div><div class="toolbar"><button class="primary" onclick="exportData()">导出 JSON</button><button onclick="importData()">导入 JSON</button><button class="danger" onclick="resetData()">恢复示例数据</button></div></div><div class="card"><div class="section-title">版本</div><div class="muted">第二版 · 关系管理核心版 · IndexedDB · JSON 备份 · PWA 离线缓存</div></div>`}
function closeModal(){modalRoot.innerHTML=''}
function addPerson(){showPersonForm(null)}
function editPerson(id){showPersonForm(person(id))}
function showPersonForm(p){let x=p?clone(p):{id:'p'+Date.now(),name:'',gender:'男',birth:'',death:'',title:'',parents:[],inherit:false};let others=dbState.people.filter(q=>q.id!==x.id);modalRoot.innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><h2>${p?'编辑人物':'添加人物'}</h2><label>姓名<input id="f_name" value="${esc(x.name)}"></label><div class="row"><label>性别<select id="f_gender"><option ${x.gender==='男'?'selected':''}>男</option><option ${x.gender==='女'?'selected':''}>女</option></select></label><label>出生日期<input id="f_birth" type="date" value="${x.birth||''}"></label></div><div class="row"><label>死亡日期<input id="f_death" type="date" value="${x.death||''}"></label><label>爵位 / 封号<input id="f_title" value="${esc(x.title||'')}"></label></div><label>父母（可选两人）<select id="f_parent1"><option value="">— 未登记 —</option>${others.map(o=>`<option value="${o.id}" ${x.parents?.[0]===o.id?'selected':''}>${esc(o.name)} · ${o.gender}</option>`).join('')}</select></label><select id="f_parent2"><option value="">— 未登记 —</option>${others.map(o=>`<option value="${o.id}" ${x.parents?.[1]===o.id?'selected':''}>${esc(o.name)} · ${o.gender}</option>`).join('')}</select><label class="check"><input id="f_inherit" type="checkbox" ${x.inherit?'checked':''}> 标记为继承人</label><div class="notice">嫡/庶会根据父母与婚姻关系自动判断：若父母中的母亲与父亲存在“正室”婚姻，则判为嫡，否则可判为庶。</div><div class="section-title">配偶关系</div><div id="spouseEditor">${spousesOf(x.id).map(s=>s.people.map(o=>`<div class="relation">配偶：${esc(o.name)}　婚姻身份：${esc(s.rel.type)} <button class="small danger" onclick="removeSpouse('${s.rel.id}','${x.id}')">解除</button></div>`).join('')).join('')||'<div class="muted">暂未登记配偶</div>'}</div><div class="toolbar"><button onclick="addSpouse('${x.id}')">＋ 添加配偶</button></div><div class="form-actions"><button class="primary" onclick="savePersonForm('${x.id}',${!!p})">保存</button>${p?`<button class="danger" onclick="deletePerson('${x.id}')">删除人物</button>`:''}<button onclick="closeModal()">取消</button></div></div></div>`}
async function savePersonForm(id,existing){let p=person(id);if(!p){p={id,name:'',gender:'男',birth:'',death:'',title:'',parents:[],inherit:false};dbState.people.push(p)}p.name=document.getElementById('f_name').value.trim()||'未命名人物';p.gender=document.getElementById('f_gender').value;p.birth=document.getElementById('f_birth').value;p.death=document.getElementById('f_death').value;p.title=document.getElementById('f_title').value.trim();p.inherit=document.getElementById('f_inherit').checked;p.parents=[document.getElementById('f_parent1').value,document.getElementById('f_parent2').value].filter(Boolean);if(p.parents.length===2&&p.parents[0]===p.parents[1])p.parents=p.parents.slice(0,1);recalc();await persist();closeModal();render()}
async function deletePerson(id){if(!confirm('删除此人物？其配偶关系也会被解除。'))return;dbState.people=dbState.people.filter(p=>p.id!==id);dbState.people.forEach(p=>p.parents=(p.parents||[]).filter(x=>x!==id));dbState.spouses=dbState.spouses.filter(s=>!s.partners.includes(id));await persist();closeModal();render()}
function addSpouse(id){let others=dbState.people.filter(p=>p.id!==id);if(!others.length)return alert('请先添加其他人物。');modalRoot.innerHTML+=`<div class="modal" style="z-index:30"><div class="sheet"><button class="close" onclick="this.parentElement.parentElement.remove()">✕</button><h2>添加配偶</h2><label>选择人物<select id="new_spouse_person">${others.map(o=>`<option value="${o.id}">${esc(o.name)} · ${o.gender}</option>`).join('')}</select></label><label>婚姻身份<select id="new_spouse_type"><option>正室</option><option>妾室</option><option>其他</option></select></label><div class="form-actions"><button class="primary" onclick="saveSpouse('${id}')">保存</button><button onclick="this.parentElement.parentElement.parentElement.remove()">取消</button></div></div></div>`}
async function saveSpouse(id){let oid=document.getElementById('new_spouse_person').value,type=document.getElementById('new_spouse_type').value;let existing=dbState.spouses.find(s=>s.partners.includes(id)&&s.partners.includes(oid));if(existing){existing.type=type}else dbState.spouses.push({id:'s'+Date.now(),partners:[id,oid],type});await persist();closeModal();editPerson(id)}
async function removeSpouse(sid,id){dbState.spouses=dbState.spouses.filter(s=>s.id!==sid);await persist();editPerson(id)}
function death(id){let p=person(id),d=prompt('死亡日期 YYYY-MM-DD',p.death||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('日期格式应为 YYYY-MM-DD');p.death=d;persist().then(render)}
function searchPeople(){let q=prompt('搜索姓名');if(q===null)return;let hits=dbState.people.filter(p=>p.name.includes(q));alert(hits.length?hits.map(p=>`${p.name}（第${p.generation}代）`).join('\n'):'没有找到')}
function exportData(){const blob=new Blob([JSON.stringify(dbState,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='江山千秋万代-族谱.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.people)||!Array.isArray(x.spouses))throw Error();dbState={version:2,familyName:x.familyName||'江山千秋万代',people:x.people,spouses:x.spouses};recalc();await persist();render();alert('导入成功。')}catch(e){alert('导入失败：不是有效的族谱 JSON。')}};r.readAsText(f)};i.click()}
async function resetData(){if(!confirm('确定恢复示例数据？当前本地数据会被替换。'))return;dbState=clone(sample);await persist();render()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script></body></html>
