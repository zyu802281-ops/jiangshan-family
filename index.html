<style>

adding:10px;border-radius:10px;background:#f8fafc;margin:7px 0}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right}input,select{width:100%;padding:11px;border:1px solid #d7dce4;border-radius:10px;margin:5px 0 10px;font-size:15px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;margin:5px 0 12px}.check input{width:auto;margin:0}.familybar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.familybar select{margin:0;flex:1}.family-name{font-weight:850;font-size:18px}.eraTable{width:100%;border-collapse:collapse;font-size:13px}.eraTable th,.eraTable td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}.tree-wrap{overflow:auto;padding:8px 2px 25px}.tree-canvas{min-width:max-content;display:flex;justify-content:center}.tree-root{display:flex;flex-direction:column;align-items:center}.couple-row{display:flex;justify-content:center;align-items:center;gap:6px;position:relative}.couple-join{width:24px;height:2px;background:#9aa2ad}.nodebox{background:#fff;border:1px solid #cfd5dd;border-radius:12px;padding:8px 10px;min-width:125px;max-width:180px;text-align:center;box-shadow:0 1px 3px #0000000d;position:relative}.nodebox.dead{opacity:.62}.nodebox .name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nodebox .meta{font-size:10px;color:#6b7280;margin-top:3px;white-space:nowrap}.nodebox .tag{font-size:9px;background:#f0f2f5;border-radius:5px;padding:2px 4px;display:inline-block;margin-top:4px}.nodebox .tag.inherit{background:#fff1bf}.nodebox .tag.conc{background:#f0e5ff}.nodebox .tag.dead{background:#e5e7eb}.children-row{display:flex;justify-content:center;gap:26px;position:relative;margin-top:28px;padding-top:18px}.children-row:before{content:"";position:absolute;top:0;left:50%;width:2px;height:18px;background:#9aa2ad}.child-branch{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:18px}.child-branch:before{content:"";position:absolute;top:0;left:50%;width:2px;height:18px;background:#9aa2ad}.children-row>.child-branch:after{content:"";position:absolute;top:0;left:50%;height:2px;width:calc(100% + 26px);transform:translateX(-50%);background:#9aa2ad}.children-row>.child-branch:first-child:after{width:calc(50% + 13px);left:100%;transform:none}.children-row>.child-branch:last-child:after{width:calc(50% + 13px);left:auto;right:100%;transform:none}.children-row>.child-branch:only-child:after{display:none}.family-tree-note{font-size:12px;color:#687386;margin-bottom:8px}.searchbox{display:none}.footer{padding:20px 0;color:#7a8495;font-size:12px;text-align:center}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}.grid{grid-template-columns:repeat(4,1fr)}}

<body>
<header><h1>江山千秋万代 · 族谱辅助</h1><div class="sub">第四版 · 多家族 · 年号纪年 · 下一年 · 对称族谱树</div><div class="era" id="eraLabel">—</div><div class="eraSub" id="eraSub">—</div><div class="yearbar"><button class="nextyear" onclick="nextYear()">⏩ 下一年</button><span class="muted" style="color:#cbd5e1">年龄与生死状态自动更新</span></div></header>
<nav id="nav"></nav><main id="app"></main><div id="modalRoot"></div>
<script>
const DB_NAME='jiangshan-family',DB_VER=4,STORE='state';let dbState=null,tab='总览',activeFamilyId=null;
const tabs=['总览','人物名录','家族树','死亡登记','设置'];
const sample={version:4,currentYear:2052,activeFamilyId:'f1',eras:[{id:'e1',name:'永嘉',startYear:2052}],families:[{id:'f1',name:'示例家族',people:[
{id:'p1',name:'第一代·家主',gender:'男',birth:'1980-01-01',death:'',title:'开国家主',parents:[],inherit:true},
{id:'p2',name:'第一代·正室',gender:'女',birth:'1982-01-01',death:'',title:'正室',parents:[],inherit:false},
{id:'p3',name:'第二代·嫡长子',gender:'男',birth:'2005-01-01',death:'',title:'继承人',parents:['p1','p2'],inherit:true},
{id:'p4',name:'第二代·庶子',gender:'男',birth:'2008-01-01',death:'',title:'庶子',parents:['p1'],inherit:false},
{id:'p5',name:'第三代·嫡孙',gender:'男',birth:'2028-01-01',death:'',title:'',parents:['p3'],inherit:false},
{id:'p6',name:'第四代·嫡曾孙',gender:'女',birth:'2052-01-01',death:'',title:'',parents:['p5'],inherit:false}],spouses:[{id:'s1',partners:['p1','p2'],type:'正室'}]}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readState(){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).get('main');q.onsuccess=()=>res(q.result?.data||null);q.onerror=()=>rej(q.error)})}
async function persist(){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).put({id:'main',data:dbState});q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function migrate(old){if(!old)return clone(sample);if(old.families)return old;let fam={id:'f1',name:old.familyName||'默认家族',people:Array.isArray(old.people)?old.people:[],spouses:Array.isArray(old.spouses)?old.spouses:[]};return {version:4,currentYear:Number(old.currentYear)||2052,activeFamilyId:'f1',eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}],families:[fam]}}
async function init(){try{dbState=migrate(await readState());if(!Array.isArray(dbState.families)||!dbState.families.length)dbState=clone(sample);if(!dbState.activeFamilyId||!dbState.families.some(f=>f.id===dbState.activeFamilyId))dbState.activeFamilyId=dbState.families[0].id;activeFamilyId=dbState.activeFamilyId;await persist();render()}catch(e){alert('本机存储初始化失败：'+e)}}
function family(){return dbState.families.find(f=>f.id===activeFamilyId)||dbState.families[0]}
function people(){return family()?.people||[]}
function person(id){return people().find(p=>p.id===id)}
function children(id){return people().filter(p=>p.parents?.includes(id))}
function spousesOf(id){return (family()?.spouses||[]).filter(s=>s.partners.includes(id)).map(s=>({rel:s,people:s.partners.filter(x=>x!==id).map(person).filter(Boolean)}))}
function yearOf(v){if(!v)return null;let m=String(v).match(/^(\d{4})/);return m?Number(m[1]):null}
function isBorn(p){let b=yearOf(p.birth);return b===null||b<=dbState.currentYear}
function isDead(p){let d=yearOf(p.death);return d!==null&&d<=dbState.currentYear}
function age(b,d){let by=yearOf(b);let ey=d?yearOf(d):dbState.currentYear;if(by===null||ey===null)return '—';if(ey<by)return '未出生';return Math.max(0,ey-by)+'岁'}
function statusText(p){if(!isBorn(p))return '未出生';if(isDead(p))return '已故';return '在世'}
function eraAt(y){let list=[...(dbState.eras||[])].filter(e=>Number.isInteger(Number(e.startYear))&&e.name).sort((a,b)=>a.startYear-b.startYear);let found=null;for(const e of list)if(y>=Number(e.startYear))found=e;return found||{name:'未命名年号',startYear:y}}
function eraDisplay(y){let e=eraAt(y),n=y-Number(e.startYear)+1;let nums=['','元','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一','三十二','三十三','三十四','三十五','三十六','三十七','三十八','三十九','四十','四十一','四十二','四十三','四十四','四十五','四十六','四十七','四十八','四十九','五十'];let ns=n<=50?nums[n]:String(n);return `${e.name}${ns}年`}
function nextYear(){dbState.currentYear=Number(dbState.currentYear||1)+1;persist().then(render)}
function generation(p,seen=new Set()){if(!p||!p.parents?.length)return 1;if(seen.has(p.id))return 1;seen.add(p.id);return 1+Math.max(...p.parents.map(x=>generation(person(x),new Set(seen))))}
function recalc(){people().forEach(p=>p.generation=generation(p));}
function legitimacy(p){if(!p.parents?.length)return '—';let mother=p.parents.map(person).find(x=>x?.gender==='女'),father=p.parents.map(person).find(x=>x?.gender==='男');if(!mother||!father)return '庶';let ok=spousesOf(mother.id).some(x=>x.rel.type==='正室'&&x.people.some(y=>y.id===father.id));return ok?'嫡':'庶'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusBadge(p){let s=statusText(p);return s==='已故'?'<span class="badge dead">已故</span>':s==='未出生'?'<span class="badge unborn">未出生</span>':'<span class="badge">在世</span>'}
function renderNav(){nav.innerHTML=tabs.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}
function render(){recalc();renderNav();document.getElementById('eraLabel').textContent=eraDisplay(dbState.currentYear);document.getElementById('eraSub').textContent=`游戏年份 ${dbState.currentYear} · 当前家族：${family()?.name||'—'}`;if(tab==='总览')overview();if(tab==='人物名录')directory();if(tab==='家族树')tree();if(tab==='死亡登记')deaths();if(tab==='设置')settings()}
function familySelector(){return `<div class="familybar"><span class="family-name">${esc(family()?.name||'家族')}</span><select onchange="switchFamily(this.value)">${dbState.families.map(f=>`<option value="${f.id}" ${f.id===activeFamilyId?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class="small" onclick="addFamily()">＋家族</button></div>`}
function overview(){let ps=people();app.innerHTML=familySelector()+`<div class="grid"><div class="card"><div class="muted">本家族人数</div><div class="num">${ps.length}</div></div><div class="card"><div class="muted">在世</div><div class="num">${ps.filter(p=>statusText(p)==='在世').length}</div></div><div class="card"><div class="muted">已故</div><div class="num">${ps.filter(p=>statusText(p)==='已故').length}</div></div><div class="card"><div class="muted">代数</div><div class="num">${ps.length?Math.max(...ps.map(p=>p.generation||1)):0}</div></div></div><div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 当前纪年</div><div style="font-size:28px;font-weight:850;margin:5px 0">${eraDisplay(dbState.currentYear)}</div><div class="muted">点击顶部「下一年」后，全家族人物年龄与生死状态按游戏年份自动更新。程序不会自动添加人物或事件。</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button><button onclick="tab='家族树';render()">查看家族树</button></div></div>`}
function personCard(p){let sp=spousesOf(p.id).flatMap(x=>x.people).map(x=>x.name).join('、')||'无';let par=p.parents?.map(x=>person(x)?.name).filter(Boolean).join('、')||'未登记';let ch=children(p.id).map(x=>x.name).join('、')||'无';let leg=legitimacy(p);return `<div class="person"><div style="flex:1"><b>${esc(p.name)}</b> <span class="badge">${p.gender} · 第${p.generation}代</span>${leg!=='—'?`<span class="badge ${leg==='庶'?'concubine':''}">${leg}</span>`:''}${p.inherit?'<span class="badge inherit">继承人</span>':''}${statusBadge(p)}<div class="muted">${esc(p.title||'无封号')} · ${p.birth||'未录出生'} · ${statusText(p)==='已故'?'享年'+age(p.birth,p.death):age(p.birth,'')}</div><div class="muted">父母：${esc(par)}<br>配偶：${esc(sp)}<br>子女：${esc(ch)}</div></div><button class="small" onclick="editPerson('${p.id}')">编辑</button></div>`}
function directory(){let ps=[...people()].sort((a,b)=>(a.generation||1)-(b.generation||1));app.innerHTML=familySelector()+`<div class="card"><div class="section-title">人物名录</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button><button onclick="searchPeople()">搜索</button></div>${ps.map(personCard).join('')||'<div class="empty">暂无人物</div>'}</div>`}
function nodeBox(p){let leg=legitimacy(p);return `<div class="nodebox ${isDead(p)?'dead':''}"><div class="name">${esc(p.name)}</div><div class="meta">${p.gender} · ${statusText(p)==='已故'?'享年'+age(p.birth,p.death):age(p.birth,'')}</div><span class="tag">第${p.generation}代</span>${leg!=='—'?`<span class="tag ${leg==='庶'?'conc':''}">${leg}</span>`:''}${p.inherit?'<span class="tag inherit">继承人</span>':''}${isDead(p)?'<span class="tag dead">已故</span>':''}</div>`}
function tree(){let roots=people().filter(p=>!p.parents?.length);app.innerHTML=familySelector()+`<div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 家族树</div><div class="family-tree-note">从上到下表示世代；夫妻横向相连；子女向下分支。点击人物节点可编辑。</div><div class="tree-wrap"><div class="tree-canvas"><div class="tree-root">${roots.map(p=>treeBranch(p,new Set())).join('')||'<div class="empty">暂无根人物，请先添加人物。</div>'}</div></div></div></div>`}
function treeBranch(p,seen){if(seen.has(p.id))return '';let ns=new Set(seen);ns.add(p.id);let rels=spousesOf(p.id);let mainSp=rels.find(x=>x.rel.type==='正室')||rels[0];let spouse=mainSp?.people?.[0]||null;let kids=children(p.id);if(spouse)kids=[...new Map([...kids,...children(spouse.id)].map(x=>[x.id,x])).values()];kids.sort((a,b)=>(a.generation||1)-(b.generation||1)||String(a.name).localeCompare(String(b.name),'zh'));return `<div class="tree-root"><div class="couple-row"><div onclick="editPerson('${p.id}')">${nodeBox(p)}</div>${spouse?`<div class="couple-join"></div><div onclick="editPerson('${spouse.id}')">${nodeBox(spouse)}</div>`:''}</div>${kids.length?`<div class="children-row">${kids.map(k=>`<div class="child-branch">${treeBranch(k,ns)}</div>`).join('')}</div>`:''}</div>`}
function deaths(){let ps=people();app.innerHTML=familySelector()+`<div class="card"><div class="section-title">死亡登记</div>${ps.map(p=>`<div class="person"><div><b>${esc(p.name)}</b>${statusBadge(p)}<div class="muted">${statusText(p)==='已故'?'死亡：'+p.death+' · 享年'+age(p.birth,p.death):statusText(p)==='未出生'?'尚未出生':'在世 / 未登记'}</div></div><button class="small" onclick="death('${p.id}')">${p.death?'修改':'登记'}</button></div>`).join('')||'<div class="empty">暂无人物</div>'}</div>`}
function settings(){let eras=[...(dbState.eras||[])].sort((a,b)=>a.startYear-b.startYear);app.innerHTML=`<div class="card"><div class="section-title">家族管理</div>${dbState.families.map(f=>`<div class="person"><div><b>${esc(f.name)}</b><div class="muted">${f.people.length}人</div></div><div class="toolbar"><button class="small" onclick="renameFamily('${f.id}')">改名</button>${dbState.families.length>1?`<button class="small danger" onclick="deleteFamily('${f.id}')">删除</button>`:''}</div></div>`).join('')}<button class="primary" onclick="addFamily()">＋ 新建家族</button></div><div class="card"><div class="section-title">年号纪年</div><div class="notice">顶部显示年号，例如“永嘉二十一年”。「下一年」只推进游戏年份；当你登记了新年号的起始年份，推进到该年会自动显示“新年号元年”。</div><table class="eraTable"><thead><tr><th>游戏年份</th><th>年号</th><th>显示</th><th></th></tr></thead><tbody>${eras.map(e=>`<tr><td>${e.startYear}</td><td>${esc(e.name)}</td><td>${eraDisplay(e.startYear)}</td><td><button class="small danger" onclick="deleteEra('${e.id}')">删除</button></td></tr>`).join('')}</tbody></table><div class="row"><label>新年号<input id="eraName" placeholder="例如 康熙"></label><label>起始游戏年份<input id="eraStart" type="number" value="${dbState.currentYear}"></label></div><button class="primary" onclick="addEra()">＋ 添加年号</button></div><div class="card"><div class="section-title">当前游戏年份</div><div class="muted">仅用于计算年龄和生死状态。修改这里不会修改人物出生/死亡资料。</div><input id="yearSetting" type="number" min="1" max="999999" value="${dbState.currentYear}"><button class="primary" onclick="saveYearSetting()">保存当前年份</button></div><div class="card"><div class="section-title">数据管理</div><div class="notice">数据保存在当前设备浏览器的 IndexedDB。建议定期导出 JSON 备份。</div><div class="toolbar"><button class="primary" onclick="exportData()">导出 JSON</button><button onclick="importData()">导入 JSON</button><button class="danger" onclick="resetData()">恢复示例数据</button></div></div><div class="footer">第四版 · 多家族 · 年号纪年 · 对称族谱树 · IndexedDB · PWA</div>`}
function closeModal(){modalRoot.innerHTML=''}
function addFamily(){let n=prompt('家族名称，例如“张氏”');if(!n?.trim())return;let id='f'+Date.now();dbState.families.push({id,name:n.trim(),people:[],spouses:[]});activeFamilyId=id;dbState.activeFamilyId=id;persist().then(render)}
function switchFamily(id){activeFamilyId=id;dbState.activeFamilyId=id;persist().then(render)}
function renameFamily(id){let f=dbState.families.find(x=>x.id===id),n=prompt('新的家族名称',f.name);if(!n?.trim())return;f.name=n.trim();persist().then(render)}
function deleteFamily(id){if(dbState.families.length<=1)return alert('至少保留一个家族。');let f=dbState.families.find(x=>x.id===id);if(!confirm(`删除“${f.name}”及其全部人物？此操作不可撤销。`))return;dbState.families=dbState.families.filter(x=>x.id!==id);activeFamilyId=dbState.families[0].id;dbState.activeFamilyId=activeFamilyId;persist().then(render)}
function addPerson(){showPersonForm(null)}function editPerson(id){showPersonForm(person(id))}
function showPersonForm(p){let x=p?clone(p):{id:'p'+Date.now(),name:'',gender:'男',birth:'',death:'',title:'',parents:[],inherit:false};let others=people().filter(q=>q.id!==x.id);modalRoot.innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><h2>${p?'编辑人物':'添加人物'}</h2><label>姓名<input id="f_name" value="${esc(x.name)}"></label><div class="row"><label>性别<select id="f_gender"><option ${x.gender==='男'?'selected':''}>男</option><option ${x.gender==='女'?'selected':''}>女</option></select></label><label>出生日期<input id="f_birth" type="date" value="${x.birth||''}"></label></div><div class="row"><label>死亡日期<input id="f_death" type="date" value="${x.death||''}"></label><label>爵位 / 封号<input id="f_title" value="${esc(x.title||'')}"></label></div><label>父母<select id="f_parent1"><option value="">— 未登记 —</option>${others.map(o=>`<option value="${o.id}" ${x.parents?.[0]===o.id?'selected':''}>${esc(o.name)} · ${o.gender}</option>`).join('')}</select></label><select id="f_parent2"><option value="">— 未登记 —</option>${others.map(o=>`<option value="${o.id}" ${x.parents?.[1]===o.id?'selected':''}>${esc(o.name)} · ${o.gender}</option>`).join('')}</select><label class="check"><input id="f_inherit" type="checkbox" ${x.inherit?'checked':''}> 标记为继承人</label><div class="notice">嫡/庶根据父母性别及两人之间的“正室”关系自动判断。没有完整父母关系时不强行判定。</div><div class="section-title">配偶关系</div><div id="spouseEditor">${spousesOf(x.id).map(s=>s.people.map(o=>`<div class="relation">配偶：${esc(o.name)}　身份：${esc(s.rel.type)} <button class="small danger" onclick="removeSpouse('${s.rel.id}','${x.id}')">解除</button></div>`).join('')).join('')||'<div class="muted">暂未登记配偶</div>'}</div><div class="toolbar"><button onclick="addSpouse('${x.id}')">＋ 添加配偶</button></div><div class="form-actions"><button class="primary" onclick="savePersonForm('${x.id}',${!!p})">保存</button>${p?`<button class="danger" onclick="deletePerson('${x.id}')">删除人物</button>`:''}<button onclick="closeModal()">取消</button></div></div></div>`}
async function savePersonForm(id){let p=person(id);if(!p){p={id,name:'',gender:'男',birth:'',death:'',title:'',parents:[],inherit:false};people().push(p)}p.name=document.getElementById('f_name').value.trim()||'未命名人物';p.gender=document.getElementById('f_gender').value;p.birth=document.getElementById('f_birth').value;p.death=document.getElementById('f_death').value;p.title=document.getElementById('f_title').value.trim();p.inherit=document.getElementById('f_inherit').checked;p.parents=[document.getElementById('f_parent1').value,document.getElementById('f_parent2').value].filter(Boolean);if(p.parents.length===2&&p.parents[0]===p.parents[1])p.parents=p.parents.slice(0,1);recalc();await persist();closeModal();render()}
async function deletePerson(id){if(!confirm('删除此人物？其配偶关系也会解除，其他人物的父母关系也会移除。'))return;let f=family();f.people=f.people.filter(p=>p.id!==id);f.people.forEach(p=>p.parents=(p.parents||[]).filter(x=>x!==id));f.spouses=f.spouses.filter(s=>!s.partners.includes(id));await persist();closeModal();render()}
function addSpouse(id){let others=people().filter(p=>p.id!==id);if(!others.length)return alert('请先添加其他人物。');modalRoot.innerHTML+=`<div class="modal" style="z-index:40"><div class="sheet"><button class="close" onclick="this.parentElement.parentElement.remove()">✕</button><h2>添加配偶</h2><label>选择人物<select id="new_spouse_person">${others.map(o=>`<option value="${o.id}">${esc(o.name)} · ${o.gender}</option>`).join('')}</select></label><label>婚姻身份<select id="new_spouse_type"><option>正室</option><option>妾室</option><option>其他</option></select></label><div class="form-actions"><button class="primary" onclick="saveSpouse('${id}')">保存</button><button onclick="this.parentElement.parentElement.parentElement.remove()">取消</button></div></div></div>`}
async function saveSpouse(id){let oid=document.getElementById('new_spouse_person').value,type=document.getElementById('new_spouse_type').value,f=family();let existing=f.spouses.find(s=>s.partners.includes(id)&&s.partners.includes(oid));if(existing)existing.type=type;else f.spouses.push({id:'s'+Date.now(),partners:[id,oid],type});await persist();editPerson(id)}
async function removeSpouse(sid,id){family().spouses=family().spouses.filter(s=>s.id!==sid);await persist();editPerson(id)}
function death(id){let p=person(id),d=prompt('死亡日期 YYYY-MM-DD',p.death||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('日期格式应为 YYYY-MM-DD');p.death=d;persist().then(render)}
function searchPeople(){let q=prompt('搜索姓名');if(q===null)return;let hits=people().filter(p=>p.name.includes(q));alert(hits.length?hits.map(p=>`${p.name}（第${p.generation}代，${statusText(p)}）`).join('\n'):'没有找到')}
function addEra(){let name=document.getElementById('eraName').value.trim(),start=Number(document.getElementById('eraStart').value);if(!name||!Number.isInteger(start)||start<1)return alert('请填写有效的年号和起始游戏年份。');let same=dbState.eras.find(e=>e.startYear===start);if(same)same.name=name;else dbState.eras.push({id:'e'+Date.now(),name,startYear:start});persist().then(render)}
function deleteEra(id){if((dbState.eras||[]).length<=1)return alert('至少保留一个年号。');if(!confirm('删除这个年号？'))return;dbState.eras=dbState.eras.filter(e=>e.id!==id);persist().then(render)}
async function saveYearSetting(){let y=Number(document.getElementById('yearSetting').value);if(!Number.isInteger(y)||y<1)return alert('请输入有效游戏年份。');dbState.currentYear=y;await persist();render()}
function exportData(){const blob=new Blob([JSON.stringify(dbState,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='江山千秋万代-族谱-v4.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=migrate(JSON.parse(r.result));if(!x.families?.length)throw Error();dbState=x;activeFamilyId=x.activeFamilyId||x.families[0].id;await persist();render();alert('导入成功。')}catch(e){alert('导入失败：不是有效的族谱 JSON。')}};r.readAsText(f)};i.click()}
async function resetData(){if(!confirm('确定恢复示例数据？当前本地数据会被替换。'))return;dbState=clone(sample);activeFamilyId='f1';await persist();render()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body></html>
