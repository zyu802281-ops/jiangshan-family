 0}.section-title{font-weight:800;margin:8px 0 5px}.empty{text-align:center;padding:25px;color:#7a8495}.notice{padding:11px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;color:#475569;margin:8px 0}.relation{padding:10px;border-radius:10px;background:#f8fafc;margin:7px 0}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d7dce4;border-radius:9px;margin:4px 0 8px;font-size:15px;background:#fff}.person-select{font-size:13px;padding:8px 9px;line-height:1.2}.person-select option{font-size:13px}.compact-select{font-size:13px;padding:8px 9px}textarea{min-height:82px;resize:vertical;font-family:inherit}.compact-sheet{padding:16px;max-width:620px}.compact-section{padding:10px 0;border-bottom:1px solid #eef0f3}.compact-section:last-of-type{border-bottom:0}.compact-title{font-weight:800;font-size:14px;margin-bottom:5px}.compact-hint{font-size:11px;color:#7a8495;margin-top:-2px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;margin:5px 0 12px}.check input{width:auto;margin:0}.familybar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.familybar select{margin:0;flex:1}.family-name{font-weight:850;font-size:18px}.eraTable{width:100%;border-collapse:collapse;font-size:13px}.eraTable th,.eraTable td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}.tree-wrap{overflow:auto;padding:8px 2px 25px}.tree-canvas{min-width:max-content;display:flex;justify-content:center}.tree-root{display:flex;flex-direction:column;align-items:center}.couple-row{display:flex;justify-content:center;align-items:center;gap:6px;position:relative}.couple-join{width:24px;height:2px;background:#9aa2ad}.nodebox{background:#fff;border:1px solid #cfd5dd;border-radius:12px;padding:8px 10px;min-width:125px;max-width:180px;text-align:center;box-shadow:0 1px 3px #0000000d;position:relative}.nodebox.dead{opacity:.62}.nodebox .name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nodebox .meta{font-size:10px;color:#6b7280;margin-top:3px;white-space:nowrap}.nodebox .tag{font-size:9px;background:#f0f2f5;border-radius:5px;padding:2px 4px;display:inline-block;margin-top:4px}.nodebox .tag.inherit{background:#fff1bf}.nodebox .tag.conc{background:#f0e5ff}.nodebox .tag.dead{background:#e5e7eb}.children-row{display:flex;justify-content:center;gap:26px;position:relative;margin-top:28px;padding-top:18px}.children-row:before{content:"";position:absolute;top:0;left:50%;width:2px;height:18px;background:#9aa2ad}.child-branch{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:18px}.child-branch:before{content:"";position:absolute;top:0;left:50%;width:2px;height:18px;background:#9aa2ad}.children-row>.child-branch:after{content:"";position:absolute;top:0;left:50%;height:2px;width:calc(100% + 26px);transform:translateX(-50%);background:#9aa2ad}.children-row>.child-branch:first-child:after{width:calc(50% + 13px);left:100%;transform:none}.children-row>.child-branch:last-child:after{width:calc(50% + 13px);left:auto;right:100%;transform:none}.children-row>.child-branch:only-child:after{display:none}.family-tree-note{font-size:12px;color:#687386;margin-bottom:8px}.footer{padding:20px 0;color:#7a8495;font-size:12px;text-align:center}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}.grid{grid-template-columns:repeat(4,1fr)}}

<body>
<header><h1>江山千秋万代 · 族谱辅助</h1><div class="sub">第十六版 · 多家族 · 皇帝继位改元 · 爵位继承 · 16岁成长提醒 · 人物备注 · 所有人物 · 撤销上一步 · 数据备份</div><div class="era" id="eraLabel">—</div><div class="eraSub" id="eraSub">—</div><div class="yearbar"><div class="toolbar" style="margin:0"><button class="nextyear" onclick="nextYear()">⏩ 下一年</button><button onclick="undoLast()">↩️ 撤销上一步</button></div><span class="muted" style="color:#cbd5e1">年龄与生死状态自动更新</span></div></header>
<nav id="nav"></nav><main id="app"></main><div id="modalRoot"></div>
<script>
const DB_NAME='jiangshan-family',DB_VER=16,STORE='state';let dbState=null,tab='总览',activeFamilyId=null,undoState=null,lastSavedState=null;
const tabs=['总览','人物名录','所有人物','家族树','设置'];
const sample={version:16,currentYear:2052,activeFamilyId:'f1',eras:[{id:'e1',name:'永嘉',startYear:2052}],rulers:[],families:[{id:'f1',name:'示例家族'}],people:[
{id:'p1',name:'第一代·家主',gender:'男',birthYear:1980,deathYear:'',lifespan:78,title:'开国家主',parents:[],inherit:true,familyId:'f1'},
{id:'p2',name:'第一代·正室',gender:'女',birthYear:1982,deathYear:'',lifespan:82,title:'正室',parents:[],inherit:false,familyId:'f1'},
{id:'p3',name:'第二代·嫡长子',gender:'男',birthYear:2005,deathYear:'',lifespan:76,title:'继承人',parents:['p1','p2'],inherit:true,familyId:'f1'},
{id:'p4',name:'第二代·庶子',gender:'男',birthYear:2008,deathYear:'',lifespan:71,title:'庶子',parents:['p1'],inherit:false,familyId:'f1'},
{id:'p5',name:'第三代·嫡孙',gender:'男',birthYear:2028,deathYear:'',lifespan:80,title:'',parents:['p3'],inherit:false,familyId:'f1'},
{id:'p6',name:'第四代·嫡曾孙',gender:'女',birthYear:2052,deathYear:'',lifespan:79,title:'',parents:['p5'],inherit:false,familyId:'f1'}],spouses:[{id:'s1',partners:['p1','p2'],type:'正室'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readState(){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).get('main');q.onsuccess=()=>res(q.result?.data||null);q.onerror=()=>rej(q.error)})}
async function persist(skipHistory=false){const d=await openDB();return new Promise((res,rej)=>{if(!skipHistory&&lastSavedState&&JSON.stringify(lastSavedState)!==JSON.stringify(dbState))undoState=clone(lastSavedState);const q=d.transaction(STORE,'readwrite').objectStore(STORE).put({id:'main',data:dbState});q.onsuccess=()=>{lastSavedState=clone(dbState);res()};q.onerror=()=>rej(q.error)})}
function migrate(old){
 if(!old)return clone(sample);
 if(old.people&&Array.isArray(old.families)&&old.families.every(f=>!f.people)){
   old.version=16;old.people=old.people.map(p=>normalizePerson(p));old.spouses=Array.isArray(old.spouses)?old.spouses:[];old.eras=Array.isArray(old.eras)&&old.eras.length?old.eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}];old.rulers=Array.isArray(old.rulers)?old.rulers:[];old.titleTransfers=Array.isArray(old.titleTransfers)?old.titleTransfers:[];return old;
 }
 if(Array.isArray(old.families)){
   const people=[],spouses=[];
   old.families.forEach(f=>{(f.people||[]).forEach(p=>people.push({...normalizePerson(p),familyId:f.id}));(f.spouses||[]).forEach(s=>spouses.push({...s,familyId:f.id}))});
   return {version:16,currentYear:Number(old.currentYear)||2052,activeFamilyId:old.activeFamilyId||old.families[0]?.id||null,eras:Array.isArray(old.eras)&&old.eras.length?old.eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}],rulers:Array.isArray(old.rulers)?old.rulers:[],titleTransfers:Array.isArray(old.titleTransfers)?old.titleTransfers:[],families:old.families.map(f=>({id:f.id,name:f.name||'未命名家族'})),people,spouses};
 }
 if(old.people){const fid='f1';return {version:16,currentYear:Number(old.currentYear)||2052,activeFamilyId:fid,eras:[{id:'e1',name:'永嘉',startYear:Number(old.currentYear)||2052}],rulers:Array.isArray(old.rulers)?old.rulers:[],titleTransfers:Array.isArray(old.titleTransfers)?old.titleTransfers:[],families:[{id:fid,name:old.familyName||'默认家族'}],people:old.people.map(p=>({...normalizePerson(p),familyId:fid})),spouses:old.spouses||[]}}
 return clone(sample);
}
function normalizePerson(p){let by=p.birthYear??yearOf(p.birth);let life=Number(p.lifespan);if(!Number.isInteger(life)||life<1)life='';return {...p,birthYear:by??'',deathYear:p.deathYear??'',deathReason:p.deathReason??'',deathType:p.deathType??'',note:p.note??'',age16Notified:!!p.age16Notified,lifespan:life,parents:Array.isArray(p.parents)?p.parents:[],inherit:!!p.inherit,familyId:p.familyId??null,birthOrder:Number(p.birthOrder)||0,title:p.title??''}}
async function init(){try{dbState=migrate(await readState());if(!Array.isArray(dbState.families)||!dbState.families.length)dbState=clone(sample);dbState.people=(dbState.people||[]).map(normalizePerson);if(!dbState.spouses)dbState.spouses=[];if(!Array.isArray(dbState.rulers))dbState.rulers=[];if(!Array.isArray(dbState.titleTransfers))dbState.titleTransfers=[];applyAutomaticDeaths();if(!dbState.activeFamilyId||!dbState.families.some(f=>f.id===dbState.activeFamilyId))dbState.activeFamilyId=dbState.families[0].id;activeFamilyId=dbState.activeFamilyId;await persist(true);lastSavedState=clone(dbState);render()}catch(e){alert('本机存储初始化失败：'+e)}}
function family(){return dbState.families.find(f=>f.id===activeFamilyId)||dbState.families[0]}
function people(all=false){return all?(dbState.people||[]):(dbState.people||[]).filter(p=>p.familyId===activeFamilyId)}
function person(id){return (dbState.people||[]).find(p=>p.id===id)}
function children(id){return (dbState.people||[]).filter(p=>p.parents?.includes(id))}
function spousesOf(id){return (dbState.spouses||[]).filter(s=>s.partners.includes(id)).map(s=>({rel:s,people:s.partners.filter(x=>x!==id).map(person).filter(Boolean)}))}
function familyNameById(id){return dbState.families.find(f=>f.id===id)?.name||'无归属家族'}
function yearOf(v){if(v===null||v===undefined||v==='')return null;let n=Number(v);return Number.isInteger(n)?n:null}
function isBorn(p){let b=yearOf(p.birthYear);return b===null||b<=dbState.currentYear}
function deathYear(p){let manual=yearOf(p.deathYear);if(manual!==null)return manual;let b=yearOf(p.birthYear),l=Number(p.lifespan);return Number.isInteger(b)&&Number.isInteger(l)?b+l:null}
function isDead(p){let d=deathYear(p);return d!==null&&dbState.currentYear>=d}
function age(b,d){let by=yearOf(b);if(by===null)return '—';let ey=d!==undefined&&d!==null&&d!==''?yearOf(d):dbState.currentYear;if(ey===null)return '—';if(ey<by)return '未出生';return Math.max(1,ey-by+1)+'岁'}
function displayAge(p){if(!isBorn(p))return '未出生';if(isDead(p)){if(p.deathType==='寿命终止'&&Number.isInteger(Number(p.lifespan)))return Number(p.lifespan)+'岁';let d=deathYear(p),b=yearOf(p.birthYear);return Number.isInteger(d)&&Number.isInteger(b)?Math.max(1,d-b+1)+'岁':'—'}return age(p.birthYear)}
function statusText(p){if(!isBorn(p))return '未出生';if(isDead(p))return '已故';return '在世'}
function eraAt(y){let list=[...(dbState.eras||[])].filter(e=>Number.isInteger(Number(e.startYear))&&e.name).sort((a,b)=>a.startYear-b.startYear);let found=null;for(const e of list)if(y>=Number(e.startYear))found=e;return found||{name:'未命名年号',startYear:y}}
function eraDisplay(y){let e=eraAt(y),n=y-Number(e.startYear)+1;let nums=['','元','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一','三十二','三十三','三十四','三十五','三十六','三十七','三十八','三十九','四十','四十一','四十二','四十三','四十四','四十五','四十六','四十七','四十八','四十九','五十'];let ns=n<=50?nums[n]:String(n);return `${e.name}${ns}年`}
function currentRuler(y){let rs=[...(dbState.rulers||[])].filter(r=>Number.isInteger(Number(r.accessionYear))&&Number(r.accessionYear)<=y).sort((a,b)=>Number(a.accessionYear)-Number(b.accessionYear));let r=rs[rs.length-1];return r?person(r.personId):null}
function applyAutomaticDeaths(){(dbState.people||[]).forEach(p=>{if(!isBorn(p))return;if(p.deathType==='意外')return;let b=yearOf(p.birthYear),l=Number(p.lifespan);if(!Number.isInteger(b)||!Number.isInteger(l)||l<1)return;let naturalDeathYear=b+l;if(dbState.currentYear>=naturalDeathYear){p.deathYear=naturalDeathYear;p.deathType='寿命终止';p.deathReason='达到登记寿命';}else if(p.deathType==='寿命终止'){p.deathYear='';p.deathType='';p.deathReason='';}})}
function checkAge16(prevYear,newYear){let reached=[];(dbState.people||[]).forEach(p=>{let b=yearOf(p.birthYear);if(!Number.isInteger(b)||p.age16Notified||!isBorn(p)||isDead(p))return;let y16=b+15;if(y16>prevYear&&y16<=newYear){p.age16Notified=true;reached.push(p.name)}});return reached}
async function advanceToYear(newYear,prevYear){dbState.currentYear=newYear;applyAutomaticDeaths();let reached=checkAge16(prevYear,newYear);await persist();render();if(reached.length)alert(`🎉 成长提醒\n\n${reached.join('、')} 已成长到16岁。\n\n可以考虑为其登记成年礼、婚配、爵位或新的身份。`)}
function nextYear(){let prev=Number(dbState.currentYear||1);advanceToYear(prev+1,prev)}
function generation(p,seen=new Set()){if(!p||!p.parents?.length)return 1;if(seen.has(p.id))return 1;seen.add(p.id);let vals=p.parents.map(x=>generation(person(x),new Set(seen))).filter(Number.isFinite);return vals.length?1+Math.max(...vals):1}
function generationLabel(p){if(!p)return '第1代';if(!(p.parents||[]).length){let ss=spousesOf(p.id).flatMap(s=>s.people);if(ss.some(o=>o&&o.familyId!==p.familyId))return '配偶';}return `第${p.generation||1}代`}
function recalc(){(dbState.people||[]).forEach(p=>p.generation=generation(p))}
function childRank(p){
 let parentIds=p.parents||[];
 let fatherId=parentIds.map(person).find(x=>x?.gender==='男')?.id;
 let motherId=parentIds.map(person).find(x=>x?.gender==='女')?.id;
 let anchor=fatherId||motherId;
 if(!anchor)return null;
 let ps=(dbState.people||[]).filter(x=>x.id===p.id||((x.parents||[]).includes(anchor)&&x.gender===p.gender));
 ps.sort((a,b)=>{let ay=yearOf(a.birthYear),by=yearOf(b.birthYear);if(ay!==by)return (ay??999999)-(by??999999);return (Number(a.birthOrder)||0)-(Number(b.birthOrder)||0)||String(a.id).localeCompare(String(b.id));});
 let idx=ps.findIndex(x=>x.id===p.id)+1;
 return idx>0?idx:null;
}
function chineseNum(n){const a=['','一','二','三','四','五','六','七','八','九'];if(!Number.isInteger(n)||n<1)return '';if(n<10)return a[n];if(n===10)return '十';if(n<20)return '十'+a[n-10];if(n%10===0)return a[n/10]+'十';return a[Math.floor(n/10)]+'十'+a[n%10]}
function rankText(n,gender){if(!n)return '';return `${chineseNum(n)}${gender==='男'?'子':'女'}`}
function childRankLabel(p){let n=childRank(p);if(!n)return '';let leg=legitimacy(p);return `${leg==='嫡'?'嫡':leg==='庶'?'庶':''}${rankText(n,p.gender)}`}
function legitimacy(p){if(!p.parents?.length)return '—';let mother=p.parents.map(person).find(x=>x?.gender==='女'),father=p.parents.map(person).find(x=>x?.gender==='男');if(!mother||!father)return '庶';let ok=spousesOf(mother.id).some(x=>x.rel.type==='正室'&&x.people.some(y=>y.id===father.id));return ok?'嫡':'庶'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusBadge(p){let s=statusText(p);return `<span class="badge ${s==='已故'?'dead':s==='未出生'?'unborn':''}">${s}</span>`}
function renderNav(){nav.innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}
function setTab(t){tab=t;render()}
function render(){recalc();renderNav();document.getElementById('eraLabel').textContent=eraDisplay(dbState.currentYear);let ruler=currentRuler(dbState.currentYear);document.getElementById('eraSub').textContent=`游戏年份 ${dbState.currentYear} · 当前家族：${family()?.name||'—'}${ruler?' · 在位：'+ruler.name:''}`;if(tab==='总览')overview();if(tab==='人物名录')directory();if(tab==='所有人物')allPeopleDirectory();if(tab==='家族树')tree();if(tab==='设置')settings()}
function familySelector(){return `<div class="familybar"><span class="family-name">当前家族</span><select onchange="switchFamily(this.value)">${dbState.families.map(f=>`<option value="${f.id}" ${f.id===activeFamilyId?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class="small" onclick="addFamily()">＋家族</button></div>`}
function overview(){let ps=people(),all=dbState.people||[],grown=all.filter(p=>{let b=yearOf(p.birthYear);return Number.isInteger(b)&&!isDead(p)&&isBorn(p)&&dbState.currentYear-b+1===16});app.innerHTML=familySelector()+`<div class="grid"><div class="card"><div class="muted">本家族人数</div><div class="num">${ps.length}</div></div><div class="card"><div class="muted">在世</div><div class="num">${ps.filter(p=>statusText(p)==='在世').length}</div></div><div class="card"><div class="muted">已故</div><div class="num">${ps.filter(p=>statusText(p)==='已故').length}</div></div><div class="card"><div class="muted">代数</div><div class="num">${ps.length?Math.max(...ps.map(p=>p.generation||1)):0}</div></div></div>${grown.length?`<div class="card growth-card"><div class="section-title">🔔 本年成长提醒</div><div class="notice">以下人物今年刚好成长到16岁。</div>${grown.map(p=>`<div class="person"><div><b>${esc(p.name)}</b><span class="badge">16岁</span><div class="muted">${p.gender} · ${esc(familyNameById(p.familyId))}</div></div><button class="small" onclick="editPerson('${p.id}')">查看</button></div>`).join('')}</div>`:''}<div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 当前纪年</div><div style="font-size:28px;font-weight:850;margin:5px 0">${eraDisplay(dbState.currentYear)}</div><div class="muted">点击「下一年」只推进游戏年份；人物年龄与生死状态自动更新，人物和事件不会自动产生。</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button><button onclick="setTab('所有人物')">查看所有人物</button><button onclick="setTab('家族树')">查看族谱树</button></div></div>`}
function personCard(p){let leg=legitimacy(p),dy=deathYear(p);return `<div class="person"><div><b>${esc(p.name)}</b>${statusBadge(p)}<div>${p.title?`<span class="badge">${esc(p.title)}</span>`:''}<span class="badge">${generationLabel(p)}</span>${leg!=='—'?`<span class="badge ${leg==='庶'?'concubine':''}">${leg}</span>`:''}${childRankLabel(p)?`<span class="badge">${childRankLabel(p)}</span>`:''}${p.inherit?'<span class="badge inherit">继承人</span>':''}${p.note?'<span class="badge">📝 有备注</span>':''}${p.familyId===null?'<span class="badge none">无归属家族</span>':''}</div><div class="muted">${p.gender} · ${statusText(p)==='已故'?'享年'+displayAge(p):displayAge(p)} · 出生：${p.birthYear||'未登记'} · 寿命：${p.lifespan||'未登记'}岁</div></div><div class="toolbar" style="margin:0"><button class="small" onclick="editPerson('${p.id}')">编辑</button><button class="small" onclick="editNote('${p.id}')">📝 备注</button>${!isDead(p)&&isBorn(p)?`<button class="small danger" onclick="death('${p.id}')">⚰️ 记录死亡</button>`:''}</div></div>`}
function directory(){let ps=people();app.innerHTML=familySelector()+`<div class="card"><div class="section-title">人物名录</div><div class="searchbox"><input id="peopleSearch" placeholder="搜索姓名、封号或家族" oninput="filterDirectory()"><button onclick="document.getElementById('peopleSearch').value='';filterDirectory()">清除</button></div><div id="directoryList">${ps.map(personCard).join('')||'<div class="empty">暂无人物</div>'}</div><div class="toolbar"><button class="primary" onclick="addPerson()">＋ 添加人物</button></div></div>`}function filterDirectory(){let q=(document.getElementById('peopleSearch')?.value||'').trim().toLowerCase();let ps=people(true).filter(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)||(familyNameById(p.familyId)||'').toLowerCase().includes(q));document.getElementById('directoryList').innerHTML=ps.map(personCard).join('')||'<div class="empty">没有找到匹配人物。</div>'}
function nodeBox(p){let leg=legitimacy(p),dy=deathYear(p);return `<div class="nodebox ${isDead(p)?'dead':''}"><div class="name">${esc(p.name)}</div><div class="meta">${p.gender} · ${statusText(p)==='已故'?'享年'+displayAge(p):displayAge(p)}</div><span class="tag">${generationLabel(p)}</span>${leg!=='—'?`<span class="tag ${leg==='庶'?'conc':''}">${leg}</span>`:''}${childRankLabel(p)?`<span class="tag">${childRankLabel(p)}</span>`:''}${p.inherit?'<span class="tag inherit">继承人</span>':''}${isDead(p)?'<span class="tag dead">已故</span>':''}</div>`}
function allPeopleDirectory(){app.innerHTML=`<div class="card"><div class="section-title">所有人物</div><div class="muted">不区分家族，默认按年龄从大到小排列。已故人物按享年排序，未出生人物排在最后。</div><div class="searchbox"><input id="allPeopleSearch" placeholder="搜索姓名、封号或家族" oninput="filterAllPeople()"><button onclick="document.getElementById('allPeopleSearch').value='';filterAllPeople()">清除</button></div><div class="toolbar filterbar"><select id="allGender" onchange="filterAllPeople()"><option value="全部">全部性别</option><option value="男">男性</option><option value="女">女性</option></select><select id="allStatus" onchange="filterAllPeople()"><option value="全部">全部状态</option><option value="成年">成年</option><option value="未成年">未成年</option><option value="已故">已故</option><option value="未出生">未出生</option></select></div><div id="allPeopleList"></div></div>`;filterAllPeople()}
function allPersonCard(p){return `<div class="person"><div><b>${esc(p.name)}</b>${statusBadge(p)}<div><span class="badge">${p.gender}</span><span class="badge">${esc(familyNameById(p.familyId))}</span>${p.title?`<span class="badge">${esc(p.title)}</span>`:''}</div><div class="muted">${statusText(p)==='已故'?'享年'+displayAge(p):displayAge(p)} · 出生：${p.birthYear||'未登记'}</div></div><div class="toolbar" style="margin:0"><button class="small" onclick="editPerson('${p.id}')">编辑</button></div></div>`}
function allPersonSortValue(p){if(!isBorn(p))return -1;let a=displayAge(p);let n=parseInt(a,10);return Number.isFinite(n)?n:0}
function filterAllPeople(){let q=(document.getElementById('allPeopleSearch')?.value||'').trim().toLowerCase(),g=document.getElementById('allGender')?.value||'全部',st=document.getElementById('allStatus')?.value||'全部';let ps=people(true).filter(p=>{let okq=!q||p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)||(familyNameById(p.familyId)||'').toLowerCase().includes(q);let okg=g==='全部'||p.gender===g;let agev=allPersonSortValue(p),okst=st==='全部'||(st==='已故'&&statusText(p)==='已故')||(st==='未出生'&&statusText(p)==='未出生')||(st==='成年'&&statusText(p)==='在世'&&agev>=16)||(st==='未成年'&&statusText(p)==='在世'&&agev<16);return okq&&okg&&okst}).sort((a,b)=>allPersonSortValue(b)-allPersonSortValue(a)||String(a.name).localeCompare(String(b.name),'zh-CN'));document.getElementById('allPeopleList').innerHTML=ps.map(allPersonCard).join('')||'<div class="empty">没有找到匹配人物。</div>'}

function tree(){let ps=people(),ids=new Set(ps.map(p=>p.id)),candidates=ps.filter(p=>!(p.parents||[]).some(id=>ids.has(id))),includedAsSpouse=new Set();candidates.forEach(p=>spousesOf(p.id).forEach(s=>s.people.forEach(o=>{if(candidates.some(c=>c.id===o.id)&&String(p.id)>String(o.id))includedAsSpouse.add(p.id)})));let roots=candidates.filter(p=>!includedAsSpouse.has(p.id));app.innerHTML=familySelector()+`<div class="card"><div class="section-title">${esc(family()?.name||'家族')} · 家族树</div><div class="family-tree-note">从上到下表示世代；配偶横向连接；子女向下分支。不同家族的配偶也会显示。没有登记父母的人物会作为根节点显示；婚入配偶不再重复作为独立根节点。</div><div class="toolbar"><button onclick="setTab('人物名录')">人物名录</button><button onclick="addPerson()" class="primary">＋ 添加人物</button></div><div class="tree-wrap"><div class="tree-canvas"><div class="tree-root">${roots.map(p=>treeBranch(p,new Set())).join('')||'<div class="empty">暂无人物，请先添加人物。</div>'}</div></div></div></div>`}
function treeBranch(p,seen){if(seen.has(p.id))return '';let ns=new Set(seen);ns.add(p.id);let rels=spousesOf(p.id),spouses=rels.flatMap(x=>x.people.map(o=>({person:o,rel:x.rel}))).filter(x=>!seen.has(x.person.id));let partnerIds=new Set(spouses.map(x=>x.person.id));let kids=[...children(p.id)];spouses.forEach(x=>kids.push(...children(x.person.id)));kids=[...new Map(kids.filter(x=>x.familyId===activeFamilyId&&x.id!==p.id).map(x=>[x.id,x])).values()].filter(x=>!partnerIds.has(x.id));kids.sort((a,b)=>(a.generation||1)-(b.generation||1)||String(a.name).localeCompare(String(b.name),'zh'));return `<div class="tree-root"><div class="couple-row"><div onclick="editPerson('${p.id}')">${nodeBox(p)}</div>${spouses.map(x=>`<div class="couple-join"></div><div onclick="editPerson('${x.person.id}')">${nodeBox(x.person)}</div>`).join('')}</div>${kids.length?`<div class="children-row">${kids.map(k=>`<div class="child-branch">${treeBranch(k,ns)}</div>`).join('')}</div>`:''}</div>`}
function settings(){let eras=[...(dbState.eras||[])].sort((a,b)=>a.startYear-b.startYear);app.innerHTML=`<div class="card"><div class="section-title">家族管理</div>${dbState.families.map(f=>`<div class="person"><div><b>${esc(f.name)}</b><div class="muted">${people(true).filter(p=>p.familyId===f.id).length}人</div></div><div class="toolbar"><button class="small" onclick="renameFamily('${f.id}')">改名</button>${dbState.families.length>1?`<button class="small danger" onclick="deleteFamily('${f.id}')">删除</button>`:''}</div></div>`).join('')}<button class="primary" onclick="addFamily()">＋ 新建家族</button></div><div class="card"><div class="section-title">年号纪年</div><div class="notice">顶部显示年号，例如“永嘉二十一年”。「下一年」只推进游戏年份；新年号从你设定的起始游戏年份开始显示“元年”。</div><table class="eraTable"><thead><tr><th>游戏年份</th><th>年号</th><th>显示</th><th></th></tr></thead><tbody>${eras.map(e=>`<tr><td>${e.startYear}</td><td>${esc(e.name)}</td><td>${eraDisplay(e.startYear)}</td><td><button class="small danger" onclick="deleteEra('${e.id}')">删除</button></td></tr>`).join('')}</tbody></table><div class="row"><label>新年号<input id="eraName" placeholder="例如 康熙"></label><label>起始游戏年份<input id="eraStart" type="number" value="${dbState.currentYear}"></label></div><button class="primary" onclick="addEra()">＋ 添加年号</button></div><div class="card"><div class="section-title">皇帝继位 / 改元</div><div class="notice">选择人物后点击“👑 皇帝继位”，填写继位年份和新年号。系统会从该游戏年份起自动使用“年号元年”，并记录在位皇帝。</div>${[...(dbState.rulers||[])].sort((a,b)=>Number(a.accessionYear)-Number(b.accessionYear)).map(r=>{let rp=person(r.personId),er=(dbState.eras||[]).find(e=>e.id===r.eraId);return `<div class="person"><div><b>${esc(rp?.name||'未知人物')}</b><div class="muted">${r.accessionYear}年继位 · ${esc(er?.name||'未命名年号')}元年</div></div><button class="small danger" onclick="deleteRuler('${r.id}')">删除</button></div>`}).join('')||'<div class="muted">暂未登记皇帝继位。</div>'}</div><div class="card"><div class="section-title">爵位继承记录</div><div class="notice">爵位不会自动继承。人物去世后，在其人物详情中点击「🏅 爵位继承」，手动选择继承人并确认继承年份。</div>${[...(dbState.titleTransfers||[])].sort((a,b)=>Number(a.year)-Number(b.year)).map(t=>{let from=person(t.fromId),to=person(t.toId);return `<div class="person"><div><b>${esc(t.title||'未命名爵位')}</b><div class="muted">${esc(from?.name||'未知人物')} → ${esc(to?.name||'未知人物')} · ${t.year}年继承</div></div><button class="small danger" onclick="deleteTitleTransfer('${t.id}')">删除</button></div>`}).join('')||'<div class="muted">暂未登记爵位继承。</div>'}</div><div class="card"><div class="section-title">当前游戏年份</div><div class="muted">只用于年龄和生死状态计算。</div><input id="yearSetting" type="number" min="1" max="999999" value="${dbState.currentYear}"><button class="primary" onclick="saveYearSetting()">保存当前年份</button></div><div class="card"><div class="section-title">数据管理</div><div class="notice">数据保存在当前设备浏览器的 IndexedDB。建议每完成一段重要族谱录入就导出一次 JSON 备份；导入前建议先导出当前数据。</div><div class="toolbar"><button class="primary" onclick="exportData()">导出 JSON</button><button onclick="importData()">导入 JSON</button><button class="danger" onclick="clearAllPeople()">🗑️ 一键清空全部人物</button><button onclick="resetData()">恢复示例数据</button></div><div class="notice" style="background:#fff7ed;color:#9a3412">“一键清空全部人物”会删除所有人物、配偶关系和父母子女关系，并把人物统计恢复为 0；家族名称、年号和当前游戏年份会保留，方便你立即重新建立族谱。</div></div><div class="footer">第十六版 · 多家族 · 皇帝继位改元 · 爵位继承 · 16岁成长提醒 · 人物备注 · 所有人物 · 撤销上一步 · 数据导入/导出 · IndexedDB · PWA</div>`}
function closeModal(){modalRoot.innerHTML=''}
function addFamily(){let n=prompt('家族名称，例如“张氏”');if(!n?.trim())return;let id='f'+Date.now();dbState.families.push({id,name:n.trim()});activeFamilyId=id;dbState.activeFamilyId=id;persist().then(render)}
function switchFamily(id){activeFamilyId=id;dbState.activeFamilyId=id;persist().then(render)}
function renameFamily(id){let f=dbState.families.find(x=>x.id===id),n=prompt('新的家族名称',f.name);if(!n?.trim())return;f.name=n.trim();persist().then(render)}
function deleteFamily(id){if(dbState.families.length<=1)return alert('至少保留一个家族。');let f=dbState.families.find(x=>x.id===id);let ids=new Set(people(true).filter(p=>p.familyId===id).map(p=>p.id));let linkedChildren=dbState.people.filter(p=>p.familyId!==id&&(p.parents||[]).some(x=>ids.has(x))).length;if(!confirm(`删除“${f.name}”及其${ids.size}名人物？\n${linkedChildren?'已有其他家族人物与该家族存在亲子关系，这些关系会被保留为未完整登记。\n':''}此操作不可撤销。`))return;dbState.people=dbState.people.filter(p=>!ids.has(p.id));dbState.people.forEach(p=>p.parents=(p.parents||[]).filter(x=>!ids.has(x)));dbState.spouses=dbState.spouses.filter(s=>!s.partners.some(x=>ids.has(x)));dbState.families=dbState.families.filter(x=>x.id!==id);activeFamilyId=dbState.families[0].id;dbState.activeFamilyId=activeFamilyId;persist().then(render)}
function addPerson(){showPersonForm(null)}
function editPerson(id){showPersonForm(person(id))}
function showPersonForm(p){
 let x=p?clone(p):{id:'p'+Date.now(),name:'',gender:'男',birthYear:dbState.currentYear,deathYear:'',deathReason:'',deathType:'',lifespan:'',title:'',note:'',parents:[],inherit:false,familyId:activeFamilyId,birthOrder:Date.now(),age16Notified:false};
 let others=people(true).filter(q=>q.id!==x.id);
 let fathers=others.filter(q=>q.gender==='男'), mothers=others.filter(q=>q.gender==='女');
 let selectedFather=x.parents?.map(person).find(q=>q?.gender==='男');
 let spouseMothers=selectedFather?spousesOf(selectedFather.id).flatMap(s=>s.people).filter(q=>q.gender==='女'&&q.id!==x.id):[];
 let motherPool=[...new Map([...mothers,...spouseMothers].map(q=>[q.id,q])).values()];
 modalRoot.innerHTML=`<div class="modal"><div class="sheet compact-sheet"><button class="close" onclick="closeModal()">✕</button>
 <h2 style="margin:0 0 12px">${p?'编辑人物':'添加人物'}</h2>
 <div class="compact-section"><div class="compact-title">基本信息</div>
 <label>姓名<input id="f_name" value="${esc(x.name)}" placeholder="例如：李承乾"></label>
 <div class="row"><label>性别<select id="f_gender"><option ${x.gender==='男'?'selected':''}>男</option><option ${x.gender==='女'?'selected':''}>女</option></select></label><label>出生年份<input id="f_birth" type="number" value="${x.birthYear??dbState.currentYear}" placeholder="${dbState.currentYear}"></label></div>
 <div class="row"><label>寿命<input id="f_lifespan" type="number" min="1" max="150" value="${x.lifespan??''}" placeholder="例如 70"></label><label>爵位 / 封号<input id="f_title" value="${esc(x.title||'')}" placeholder="可不填"></label></div></div>
 <div class="compact-section"><div class="compact-title">人物备注</div><textarea id="f_note" placeholder="记录性格、经历、功绩、婚姻、事件等……">${esc(x.note||'')}</textarea></div>
 <div class="compact-section"><div class="compact-title">父母关系</div>${p?`<div class="row"><label>父亲<div class="notice" style="margin:4px 0"><strong>${esc(selectedFather?.name||'—')}</strong>${selectedFather?` · ${esc(familyNameById(selectedFather.familyId))}`:''}</div></label><label>母亲<div class="notice" style="margin:4px 0"><strong>${esc(x.parents?.map(person).find(q=>q?.gender==='女')?.name||'—')}</strong>${x.parents?.map(person).find(q=>q?.gender==='女')?` · ${esc(familyNameById(x.parents.map(person).find(q=>q?.gender==='女').familyId))}`:''}</div></label></div><div class="compact-hint">父母关系已锁定，避免误操作改变族谱。需要纠正时使用下方“修改父母关系”。</div><button class="small" onclick="editParents('${x.id}')">✏️ 修改父母关系</button>`:`<div class="row"><label>父亲<select id="f_parent1" class="person-select"><option value="">— 未登记 —</option>${fathers.map(o=>`<option value="${o.id}" ${x.parents?.includes(o.id)?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label><label>母亲<select id="f_parent2" class="person-select"><option value="">— 未登记 —</option>${motherPool.map(o=>`<option value="${o.id}" ${x.parents?.includes(o.id)?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label></div><div class="compact-hint">首次创建时可选择任意家族的父亲、母亲；保存后父母关系会锁定。</div>`}</div>
 <div class="compact-section"><div class="compact-title">身份与关系</div><label class="check"><input id="f_inherit" type="checkbox" ${x.inherit?'checked':''}> 标记为继承人</label><div id="spouseEditor">${spousesOf(x.id).map(s=>s.people.map(o=>`<div class="relation">配偶：${esc(o.name)} · ${familyNameById(o.familyId)} · ${esc(s.rel.type)} <button class="small danger" onclick="removeSpouse('${s.rel.id}','${x.id}')">解除</button></div>`).join('')).join('')||'<div class="muted">暂未登记配偶</div>'}</div><div class="toolbar"><button onclick="addSpouse('${x.id}')">＋ 添加配偶</button>${p?`<button class="primary" onclick="addChild('${x.id}')">＋ 新增子女</button>`:''}${p&&x.inherit?`<button onclick="accession('${x.id}')">👑 皇帝继位</button>`:''}${p&&isDead(x)&&x.title&&x.title!=='皇帝'?`<button onclick="inheritTitle('${x.id}')">🏅 爵位继承</button>`:''}</div></div>
 ${p&&isDead(x)?`<div class="notice"><strong>死亡：</strong>${deathYear(x)}年 · ${x.deathType==="意外"?'意外死亡':'寿命终止'}${x.deathReason?` · ${esc(x.deathReason)}`:''}</div>`:''}
 <div class="form-actions"><button class="primary" onclick="savePersonForm('${x.id}')">保存</button>${p&&!isDead(x)&&isBorn(x)?`<button class="danger" onclick="death('${x.id}')">⚰️ 记录死亡</button>`:''}${p?`<button class="danger" onclick="deletePerson('${x.id}')">删除人物</button>`:''}<button onclick="closeModal()">取消</button></div>
 </div></div>`;
 if(!p){document.getElementById('f_parent1').addEventListener('change',()=>refreshParentMotherChoices(x.id));}
}
function refreshParentMotherChoices(personId){
 let sel=document.getElementById('f_parent1'), ms=document.getElementById('f_parent2'); if(!sel||!ms)return;
 let current=ms.value, father=person(sel.value);
 let base=people(true).filter(q=>q.id!==personId&&q.gender==='女');
 let spouse=father?spousesOf(father.id).flatMap(s=>s.people).filter(q=>q.gender==='女'&&q.id!==personId):[];
 let pool=[...new Map([...base,...spouse].map(q=>[q.id,q])).values()];
 ms.innerHTML='<option value="">— 未登记 —</option>'+pool.map(o=>`<option value="${o.id}">${esc(o.name)} · ${familyNameById(o.familyId)} · ${statusText(o)}</option>`).join('');
 if(pool.some(o=>o.id===current))ms.value=current;
}

function childParentsFor(id){
 let me=person(id), ss=spousesOf(id).flatMap(s=>s.people.filter(o=>o.id!==id).map(o=>({person:o,type:s.rel.type})));
 if(me?.gender==='女') return {mother:me,fathers:ss.filter(x=>x.person.gender==='男')};
 return {father:me,mothers:ss.filter(x=>x.person.gender==='女')};
}
function addChild(id){
 let me=person(id); if(!me)return;
 let info=childParentsFor(id), father=info.father, mother=info.mother, fathers=info.fathers||[], mothers=info.mothers||[];
 if(me.gender==='女' && fathers.length===0)return alert('这位母亲暂未登记男性配偶。请先添加配偶后再新增子女。');
 if(me.gender==='男' && mothers.length===0)return alert('这位父亲暂未登记女性配偶。请先添加配偶后再新增子女。');
 let fatherId=father?.id||fathers[0]?.person.id||'', motherId=mother?.id||mothers[0]?.person.id||'';
 if(fathers.length>1) return chooseChildParent(id,'father',fathers.map(x=>x.person));
 if(mothers.length>1) return chooseChildParent(id,'mother',mothers.map(x=>x.person));
 showChildForm(id,fatherId,motherId);
}
function chooseChildParent(sourceId,kind,opts){
 let label=kind==='father'?'父亲':'母亲';
 modalRoot.innerHTML=`<div class="modal" style="z-index:50"><div class="sheet"><button class="close" onclick="editPerson('${sourceId}')">✕</button><h2>新增子女</h2><div class="notice">${esc(person(sourceId).name)}有多位${label==='父亲'?'男性配偶':'女性配偶'}，请先确定孩子的${label}。</div><label>孩子的${label}<select id="child_parent_choice">${opts.map(o=>`<option value="${o.id}">${esc(o.name)} · ${familyNameById(o.familyId)}</option>`).join('')}</select></label><div class="form-actions"><button class="primary" onclick="continueChild('${sourceId}','${kind}')">继续</button><button onclick="editPerson('${sourceId}')">取消</button></div></div></div>`;
}
function continueChild(sourceId,kind){let chosen=document.getElementById('child_parent_choice').value, me=person(sourceId);if(kind==='father')showChildForm(sourceId,chosen,me.id);else showChildForm(sourceId,me.id,chosen)}
function showChildForm(sourceId,fatherId,motherId){
 let father=person(fatherId), mother=person(motherId), fid=father?.familyId??mother?.familyId??activeFamilyId;
 modalRoot.innerHTML=`<div class="modal" style="z-index:50"><div class="sheet"><button class="close" onclick="editPerson('${sourceId}')">✕</button><h2>新增子女</h2>
 <div class="notice">父母已自动填写，保存后系统会自动建立亲子关系。排行按<strong>男女分别计算</strong>，嫡庶混合排行。</div>
 <div class="row"><label>父亲<div class="notice" style="margin:4px 0"><strong>${esc(father?.name||'—')}</strong></div></label><label>母亲<div class="notice" style="margin:4px 0"><strong>${esc(mother?.name||'—')}</strong></div></label></div>
 <label>子女姓名<input id="child_name" autofocus></label><div class="row"><label>性别<select id="child_gender"><option>男</option><option>女</option></select></label><label>出生年份<input id="child_birth" type="number" value="${dbState.currentYear}"></label></div>
 <div class="row"><label>寿命（岁）<input id="child_lifespan" type="number" min="1" max="150" placeholder="例如 70"></label><div class="notice" style="margin:5px 0 10px">出生当年 = 1岁</div></div>
 <label>爵位 / 封号<input id="child_title"></label><label class="check"><input id="child_inherit" type="checkbox"> 标记为继承人</label>
 <div class="notice"><strong>嫡庶：</strong>系统根据父母与配偶身份自动判断。嫡庶<strong>不参与排行</strong>；儿子统一排行、女儿统一排行。</div>
 <div class="form-actions"><button class="primary" onclick="saveChildForm('${sourceId}','${fatherId}','${motherId}')">保存子女</button><button onclick="editPerson('${sourceId}')">取消</button></div></div></div>`;
}
async function saveChildForm(sourceId,fatherId,motherId){
 let name=document.getElementById('child_name').value.trim()||'未命名人物',gender=document.getElementById('child_gender').value,birth=yearOf(document.getElementById('child_birth').value)||dbState.currentYear,life=Number(document.getElementById('child_lifespan').value);
 if(!Number.isInteger(life)||life<1||life>150)return alert('请填写有效的寿命（1～150岁）。');
 let father=person(fatherId),mother=person(motherId);
 let p={id:'p'+Date.now(),name,gender,birthYear:birth,deathYear:'',deathReason:'',deathType:'',note:'',age16Notified:false,lifespan:life,title:document.getElementById('child_title').value.trim(),parents:[fatherId,motherId].filter(Boolean),inherit:document.getElementById('child_inherit').checked,familyId:father?.familyId??mother?.familyId??activeFamilyId,birthOrder:Date.now()};
 dbState.people.push(p);
 await persist(); closeModal(); render(); alert(`${name}已添加。${childRankLabel(p)?'排行：'+childRankLabel(p):''}`);
}
async function savePersonForm(id){let p=person(id),isNew=!p;if(!p){p={id,name:'',gender:'男',birthYear:'',deathYear:'',deathReason:'',deathType:'',lifespan:'',title:'',parents:[],inherit:false,familyId:activeFamilyId,birthOrder:Date.now(),note:'',age16Notified:false};dbState.people.push(p)}p.name=document.getElementById('f_name').value.trim()||'未命名人物';p.gender=document.getElementById('f_gender').value;p.birthYear=yearOf(document.getElementById('f_birth').value)||dbState.currentYear;let enteredLife=Number(document.getElementById('f_lifespan').value);if(!Number.isInteger(enteredLife)||enteredLife<1||enteredLife>150)return alert('请填写有效的寿命（1～150岁）。');p.lifespan=enteredLife;p.deathYear=p.deathYear??'';p.deathReason=p.deathReason??'';p.deathType=p.deathType??'';p.title=document.getElementById('f_title').value.trim();p.note=document.getElementById('f_note').value.trim();p.familyId=activeFamilyId;p.inherit=document.getElementById('f_inherit').checked;if(isNew){p.parents=[document.getElementById('f_parent1').value,document.getElementById('f_parent2').value].filter(Boolean);if(p.parents.length===2&&p.parents[0]===p.parents[1])p.parents=p.parents.slice(0,1);}if(!p.birthOrder)p.birthOrder=Date.now();await persist();closeModal();render()}
async function editParents(id){let p=person(id);if(!p)return;let fathers=people(true).filter(q=>q.id!==id&&q.gender==='男'),mothers=people(true).filter(q=>q.id!==id&&q.gender==='女');let cf=p.parents?.map(person).find(q=>q?.gender==='男')?.id||'',cm=p.parents?.map(person).find(q=>q?.gender==='女')?.id||'';if(!confirm(`确定要修改“${p.name}”的父母关系吗？\n\n这是族谱核心关系，修改后会影响世代、嫡庶和子女关系。`))return;modalRoot.innerHTML=`<div class="modal"><div class="sheet compact-sheet"><button class="close" onclick="editPerson('${id}')">✕</button><h2>修改父母关系</h2><div class="notice">可选择任意家族人物。修改后系统会重新计算世代与排行。</div><div class="row"><label>父亲<select id="edit_father"><option value="">— 未登记 —</option>${fathers.map(o=>`<option value="${o.id}" ${o.id===cf?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label><label>母亲<select id="edit_mother"><option value="">— 未登记 —</option>${mothers.map(o=>`<option value="${o.id}" ${o.id===cm?'selected':''}>${esc(o.name)} · ${esc(familyNameById(o.familyId))}</option>`).join('')}</select></label></div><div class="form-actions"><button class="primary" onclick="saveParents('${id}')">保存父母关系</button><button onclick="editPerson('${id}')">取消</button></div></div></div>`}
async function saveParents(id){let p=person(id);if(!p)return;let f=document.getElementById('edit_father')?.value||'',m=document.getElementById('edit_mother')?.value||'';if(f&&m&&f===m)return alert('父亲和母亲不能是同一个人物。');p.parents=[f,m].filter(Boolean);await persist();closeModal();render();alert('父母关系已更新。')}
async function editNote(id){let p=person(id);if(!p)return;let note=prompt(`编辑“${p.name}”的备注\n\n可记录性格、经历、功绩、婚姻、事件等。`,p.note||'');if(note===null)return;p.note=note.trim();await persist();render()}
async function deletePerson(id){let p=person(id);let hasKids=dbState.people.some(x=>(x.parents||[]).includes(id));let hasSpouse=dbState.spouses.some(s=>s.partners.includes(id));let warning=hasKids||hasSpouse?'此人物存在亲子或配偶关系，删除后相关关系会解除。':'';if(!confirm(`确定删除“${p?.name||'此人物'}”？${warning?'\n'+warning:''}\n此操作不可撤销。`))return;dbState.people=dbState.people.filter(x=>x.id!==id);dbState.people.forEach(x=>x.parents=(x.parents||[]).filter(v=>v!==id));dbState.spouses=dbState.spouses.filter(s=>!s.partners.includes(id));await persist();closeModal();render()}
function addSpouse(id){let families=[...dbState.families];modalRoot.innerHTML+=`<div class="modal" style="z-index:40"><div class="sheet"><button class="close" onclick="this.parentElement.parentElement.remove()">✕</button><h2>添加配偶</h2><div class="notice">先选择配偶所属家族；选择“无归属家族”时，可直接输入姓名并在这里生成新人物。</div><label>配偶所属家族<select id="new_spouse_family" onchange="refreshSpouseChooser('${id}')"><option value="">无归属家族</option>${families.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><div id="spouseChooser"></div><label>婚姻身份<select id="new_spouse_type"><option>正室</option><option>妾室</option><option>其他</option></select></label><div class="form-actions"><button class="primary" onclick="saveSpouse('${id}')">保存</button><button onclick="this.parentElement.parentElement.parentElement.remove()">取消</button></div></div></div>`;refreshSpouseChooser(id)}
function refreshSpouseChooser(id){let fid=document.getElementById('new_spouse_family').value,box=document.getElementById('spouseChooser');if(!fid){box.innerHTML=`<label>新配偶姓名<input id="new_spouse_name" placeholder="例如 王氏"></label><div class="row"><label>性别<select id="new_spouse_gender"><option>女</option><option>男</option></select></label><label>出生年份<input id="new_spouse_birth" type="number" value="${dbState.currentYear}" placeholder="例如 2052"></label></div><label>寿命（岁）<input id="new_spouse_lifespan" type="number" min="1" max="150" value="" placeholder="请输入游戏中的寿命"></label>`;return}let opts=people(true).filter(p=>p.familyId===fid&&p.id!==id);box.innerHTML=`<label>选择具体人物<select id="new_spouse_person">${opts.map(o=>`<option value="${o.id}">${esc(o.name)} · ${o.gender} · ${statusText(o)}</option>`).join('')||'<option value="">该家族暂无人物</option>'}</select></label>`}
async function saveSpouse(id){let fid=document.getElementById('new_spouse_family').value,type=document.getElementById('new_spouse_type').value,oid='';if(fid){oid=document.getElementById('new_spouse_person')?.value||'';if(!oid)return alert('该家族暂无可选择的人物。')}else{let name=document.getElementById('new_spouse_name').value.trim();let life=Number(document.getElementById('new_spouse_lifespan').value);if(!name)return alert('请输入新配偶姓名。');if(!Number.isInteger(life)||life<1||life>150)return alert('请填写有效的寿命（1～150岁）。');let p={id:'p'+Date.now(),name,gender:document.getElementById('new_spouse_gender').value,birthYear:yearOf(document.getElementById('new_spouse_birth').value)||dbState.currentYear,deathYear:'',deathReason:'',deathType:'',note:'',age16Notified:false,lifespan:Number(document.getElementById('new_spouse_lifespan').value),title:'',parents:[],inherit:false,familyId:null};dbState.people.push(p);oid=p.id}let existing=dbState.spouses.find(s=>s.partners.includes(id)&&s.partners.includes(oid));if(existing)existing.type=type;else dbState.spouses.push({id:'s'+Date.now(),partners:[id,oid],type});await persist();editPerson(id)}
async function removeSpouse(sid,id){dbState.spouses=dbState.spouses.filter(s=>s.id!==sid);await persist();editPerson(id)}
async function death(id){let p=person(id);if(!p||isDead(p))return alert('该人物已经是已故状态。');if(!isBorn(p))return alert('该人物尚未出生，不能登记死亡。');let y=prompt(`记录“${p.name}”的意外死亡年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(y===null)return;let year=yearOf(y);let birth=yearOf(p.birthYear);if(year===null||birth===null||year<birth||year>dbState.currentYear)return alert(`请输入 ${birth}～${dbState.currentYear} 之间的有效年份。`);let reason=prompt('死亡原因（可选，例如：意外、战乱、疾病等）','意外');if(reason===null)reason='意外';p.deathYear=year;p.deathType='意外';p.deathReason=reason.trim();await persist();closeModal();render();alert(`${p.name}已记录为${year}年意外死亡。`)}
function searchPeople(){let q=prompt('搜索姓名');if(q===null)return;let hits=people(true).filter(p=>p.name.includes(q));alert(hits.length?hits.map(p=>`${p.name}（${familyNameById(p.familyId)}，第${p.generation}代，${statusText(p)}）`).join('\n'):'没有找到')}
async function inheritTitle(sourceId){
 let source=person(sourceId);if(!source||!isDead(source)||!source.title||source.title==='皇帝')return alert('该人物没有可继承的爵位。');
 let candidates=people(true).filter(p=>p.id!==sourceId&&isBorn(p)&&!isDead(p));
 candidates.sort((a,b)=>{let af=a.familyId===source.familyId?0:1,bf=b.familyId===source.familyId?0:1;if(af!==bf)return af-bf;let aa=displayAge(a)==='未出生'?-1:yearOf(a.birthYear);let bb=displayAge(b)==='未出生'?-1:yearOf(b.birthYear);return (bb??-999999)-(aa??-999999)||String(a.name).localeCompare(String(b.name));});
 if(!candidates.length)return alert('当前没有可继承爵位的在世人物。');
 let opts=candidates.map((p,i)=>`${i+1}. ${p.name} · ${p.gender} · ${statusText(p)} · ${familyNameById(p.familyId)}${p.inherit?' · 继承人':''}`).join('\n');
 let input=prompt(`“${source.name}”的爵位为“${source.title}”。\n\n请选择爵位继承人（输入编号）：\n\n${opts}`, '1');
 if(input===null)return;let idx=Number(input)-1;if(!Number.isInteger(idx)||idx<0||idx>=candidates.length)return alert('请输入有效的继承人编号。');
 let heir=candidates[idx];if(heir.title&&heir.title!==source.title){if(!confirm(`“${heir.name}”目前已有“${heir.title}”。\n\n确定用“${source.title}”替换其当前爵位/封号吗？`))return;}let year=prompt(`“${heir.name}”继承“${source.title}”的年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(year===null)return;year=yearOf(year);if(year===null||year<1||year>dbState.currentYear)return alert(`请输入 1～${dbState.currentYear} 之间的有效年份。`);
 if(!confirm(`确定让“${heir.name}”在${year}年继承“${source.title}”吗？\n\n原持有人：${source.name}\n新持有人：${heir.name}`))return;
 let oldTitle=heir.title||'';heir.title=source.title;
 dbState.titleTransfers=dbState.titleTransfers||[];dbState.titleTransfers.push({id:'tt'+Date.now(),title:source.title,fromId:source.id,toId:heir.id,year,sourceDeathYear:deathYear(source)});
 await persist();closeModal();render();alert(`${heir.name}已于${year}年继承“${source.title}”。`);
}
async function accession(id){
 let p=person(id);if(!p)return;
 let y=prompt(`登记“${p.name}”继位年份。\n当前游戏年份：${dbState.currentYear}`,String(dbState.currentYear));if(y===null)return;
 let year=yearOf(y);if(year===null||year<1)return alert('请输入有效的继位年份。');
 let eraName=prompt(`为“${p.name}”设置新年号。\n例如：康熙`, '新年号');if(eraName===null)return;eraName=eraName.trim();if(!eraName)return alert('请输入新年号。');
 if(dbState.rulers?.some(r=>Number(r.accessionYear)===year)){if(!confirm('这个游戏年份已经登记过皇帝继位，仍要新增吗？'))return;}
 let same=(dbState.eras||[]).find(e=>Number(e.startYear)===year);if(same)same.name=eraName;else{same={id:'e'+Date.now(),name:eraName,startYear:year};dbState.eras.push(same)}
 dbState.rulers=(dbState.rulers||[]).filter(r=>Number(r.accessionYear)!==year);dbState.rulers.push({id:'r'+Date.now(),personId:id,accessionYear:year,eraId:same.id});
 if(!p.title)p.title='皇帝';
 await persist();closeModal();render();alert(`${p.name}已登记为${year}年继位，${eraDisplay(year)}起用“${eraName}”年号。`);
}
function addEra(){let name=document.getElementById('eraName').value.trim(),start=Number(document.getElementById('eraStart').value);if(!name||!Number.isInteger(start)||start<1)return alert('请填写有效的年号和起始游戏年份。');let same=dbState.eras.find(e=>e.startYear===start);if(same)same.name=name;else dbState.eras.push({id:'e'+Date.now(),name,startYear:start});persist().then(render)}
async function deleteTitleTransfer(id){let t=(dbState.titleTransfers||[]).find(x=>x.id===id);if(!t)return;if(!confirm('删除这条爵位继承记录？不会自动恢复人物原爵位。'))return;dbState.titleTransfers=dbState.titleTransfers.filter(x=>x.id!==id);await persist();render()}
async function deleteRuler(id){let r=(dbState.rulers||[]).find(x=>x.id===id);if(!r)return;if(!confirm('删除这条皇帝继位记录？年号不会自动删除。'))return;dbState.rulers=dbState.rulers.filter(x=>x.id!==id);await persist();render()}
function deleteEra(id){if((dbState.eras||[]).length<=1)return alert('至少保留一个年号。');if(!confirm('删除这个年号？'))return;dbState.eras=dbState.eras.filter(e=>e.id!==id);persist().then(render)}
async function saveYearSetting(){let y=Number(document.getElementById('yearSetting').value);if(!Number.isInteger(y)||y<1)return alert('请输入有效游戏年份。');let prev=Number(dbState.currentYear||1);await advanceToYear(y,prev)}
async function undoLast(){if(!undoState)return alert('目前没有可以撤销的操作。');if(!confirm('撤销上一步操作？'))return;dbState=clone(undoState);activeFamilyId=dbState.activeFamilyId||dbState.families?.[0]?.id||null;undoState=null;await persist(true);render();alert('已撤销上一步操作。')}
function exportData(){const blob=new Blob([JSON.stringify(dbState,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='江山千秋万代-族谱-第十六版-备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=migrate(JSON.parse(r.result));if(!x.families?.length)throw Error();dbState=x;activeFamilyId=x.activeFamilyId||x.families[0].id;await persist();render();alert('导入成功。')}catch(e){alert('导入失败：不是有效的族谱 JSON。')}};r.readAsText(f)};i.click()}
async function resetData(){if(!confirm('确定恢复示例数据？当前本地数据会被替换。'))return;dbState=clone(sample);activeFamilyId='f1';await persist();render()}
async function clearAllPeople(){
  const count=(dbState.people||[]).length;
  if(!count){alert('当前已经没有人物了。');return}
  const ok=confirm(`确定要清空全部 ${count} 名人物吗？\n\n这会同时删除所有配偶关系、父母子女关系以及人物统计。\n家族名称、年号和当前游戏年份会保留。\n\n此操作不可撤销。`);
  if(!ok)return;
  dbState.people=[];
  dbState.spouses=[];
  dbState.families=(dbState.families||[]).map(f=>({...f}));
  await persist();
  tab='总览';
  render();
  alert('已清空全部人物，当前族谱已恢复为 0 人。');
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
